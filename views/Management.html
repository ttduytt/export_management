<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
  <script src="/js/highcharts.js"></script>
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/management.js"></script>
  <title>Delivery Management - Management Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #040818;
    }

    :root {
      --thead-bg: #3b4689;
      --thead-border: rgba(255, 255, 255, 0.25);
      --thead-color: #ffffff;
      --tbody-border: rgba(255, 255, 255, 0.12);
      --tbody-hover: rgba(255, 255, 255, 0.05);
      --td-color: #ffffff;
    }

    body.light-theme {
      --thead-bg: #1a5276;
      --thead-border: rgba(255, 255, 255, 0.3);
      --thead-color: #ffffff;
      --tbody-border: rgba(0, 0, 0, 0.12);
      --tbody-hover: #e8f4fd;
      --td-color: #1f2937;
    }

    body.light-theme {
      background-color: white;
      color: #e3e2e9;
    }

    body.light-theme .container {
      color: #1f2937;
    }

    body.light-theme .welcome-card {
      background: linear-gradient(135deg, #e0e7ff 0%, #dbeafe 100%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    body.light-theme .welcome-text h2 {
      color: #1f2937;
    }

    body.light-theme .stats strong,
    body.light-theme .stats span {
      color: #1f2937;
    }

    body.light-theme .divider {
      background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
    }

    body.light-theme .chart-card {
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }

    body.light-theme .chart-header h3 {
      color: #1f2937;
    }

    body.light-theme .chart-header p {
      color: #6b7280;
    }

    body.light-theme footer {
      color: #6b7280;
      background: white;
      border-top: 1px solid #e5e7eb;
    }

    body.light-theme mark {
      background-color: #fef08a;
      color: #854d0e;
    }

    body.light-theme .highcharts-title,
    body.light-theme .highcharts-subtitle,
    body.light-theme .highcharts-axis-labels text,
    body.light-theme .highcharts-legend-item text,
    body.light-theme .highcharts-data-label text,
    body.light-theme .highcharts-label text {
      fill: #1f2937 !important;
    }

    body.light-theme .highcharts-axis-line,
    body.light-theme .highcharts-tick {
      stroke: #9ca3af !important;
    }

    body.light-theme .highcharts-grid-line {
      stroke: #e5e7eb !important;
    }

    body.light-theme .grid-table-wrap {
      background: white;
      border: 1px solid #b0c4d8;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    body.light-theme #factorySelect,
    body.light-theme .date-filter,
    body.light-theme .searchText,
    body.light-theme .edit-input {
      background: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    body.light-theme #factorySelect:focus,
    body.light-theme .date-filter:focus,
    body.light-theme .searchText:focus,
    body.light-theme .edit-input:focus {
      background: white;
      border-color: #2a8f9e;
    }

    body.light-theme #factorySelect option {
      background-color: white;
      color: #1f2937;
    }

    body.light-theme .searchText::placeholder {
      color: #9ca3af;
    }

    body.light-theme input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0);
    }

    body.light-theme .add-user,
    body.light-theme .import,
    body.light-theme .export,
    body.light-theme .add-spec {
      background: none;
    }

    body.light-theme .add-user:hover,
    body.light-theme .import:hover,
    body.light-theme .export:hover,
    body.light-theme .add-spec:hover {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
    }

    body.light-theme .edit-user,
    body.light-theme .delete-user,
    body.light-theme .edit-model,
    body.light-theme .delete-model {
      background: linear-gradient(135deg, #2a8f9e 0%, #0891b2 100%);
    }

    body.light-theme .edit-user:hover,
    body.light-theme .delete-user:hover,
    body.light-theme .edit-model:hover,
    body.light-theme .delete-model:hover {
      background: linear-gradient(135deg, #0e7490 0%, #0e7490 100%);
    }

    body.light-theme #clearFilters {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    }

    body.light-theme #clearFilters:hover {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
    }

    body.light-theme .status-badge.complete {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    body.light-theme .status-badge.wait {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #f59e0b;
    }

    body.light-theme .status-badge.run {
      background-color: #dbeafe;
      color: #1e40af;
      border: 1px solid #3b82f6;
    }

    body.light-theme .role-badge.manager {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    body.light-theme .role-badge.user {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #f59e0b;
    }



    body.light-theme .grid-tr {
      background-color: #ffffff;
    }

    body.light-theme .grid-tr:hover {
      background: #f9fafb;
    }

    body.light-theme .grid-tr:not(:last-child) .grid-td {
      border-bottom: none;
    }

    body.light-theme .grid-td {
      border: 1px solid rgba(0, 0, 0, 0.45);
      ;
      color: #1f2937;
    }

    body.light-theme .grid-th {
      border-bottom: 2px solid rgba(0, 0, 0, 0.45);
    }

    /* ── Layout ── */
    footer {
      color: white;
      font-size: 12px;
      padding: 20px;
      position: fixed;
      bottom: 0;
      right: 0;
      text-align: right;
      width: 100%;
    }

    .container {
      display: flex;
      color: white;
      flex-direction: column;
      height: auto;
      margin-top: 16px;
    }

    .top-row {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 40%;
      height: 100%;
      flex: 1;
      color: white;
      flex-wrap: wrap;
    }

    .bottom-row {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 40%;
      flex: 1;
      color: white;
      flex-wrap: wrap;
    }

    .top-row,
    .bottom-row {
      width: calc(100% - 20px);
      margin: 10px;
    }

    /* ── Welcome card ── */
    .welcome-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, rgba(102, 126, 234, .25) 0%, rgba(118, 75, 162, .25) 100%);
      border-radius: 8px;
      padding: 30px 20px;
      flex-direction: row;
      height: auto;
      text-align: center;
      width: auto;
    }

    .welcome-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .welcome-text h2 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .stats div {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stats strong {
      font-size: 26px;
      font-weight: 600;
      color: #fff;
    }

    .stats span {
      color: #fff;
      font-size: 14px;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: linear-gradient(135deg, rgba(102, 126, 234, .25) 0%, rgba(118, 75, 162, .25) 100%);
    }

    .welcome-right img {
      width: 100%;
      max-width: 350px;
      margin-top: 20px;
    }

    /* ── Charts ── */
    .chart-row {
      display: flex;
      flex-direction: row;
      gap: 20px;
      width: 100%;
      margin: 0;
    }

    .chart-card {
      flex: 1;
      background: linear-gradient(135deg, rgba(102, 126, 234, .25) 0%, rgba(118, 75, 162, .25) 100%);
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
    }

    .chart-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 8px;
    }

    .chart-header p {
      font-size: 14px;
      color: #6b7280;
      margin: 0 0 20px;
    }

    .chart-container {
      width: 100%;
      height: 300px;
      position: relative;
    }

    .chart-container div {
      width: 100% !important;
      height: 100% !important;
    }

    .grid-table-wrap {
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(102, 126, 234, .25) 0%, rgba(118, 75, 162, .25) 100%);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
      display: flex;
      flex-direction: column;
      flex: 1;
      max-height: 400px;
    }

    /* Toolbar */
    .grid-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px 10px;
      background-color: var(--thead-bg);
      flex-wrap: wrap;
    }

    .grid-toolbar-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--thead-color);
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 20px;
    }

    /* Header */
    .grid-thead {
      background-color: var(--thead-bg);
      border-top: 1px solid var(--thead-border);
    }

    .grid-row {
      display: flex;
      margin-right: 15px;
    }

    .grid-th {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      color: var(--thead-color);
      text-transform: uppercase;
      text-align: center;
      border-right: 1px solid var(--thead-border);
      border-bottom: 2px solid var(--thead-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .grid-th:last-child {
      border-right: none;
    }

    /* Body scroll */
    .grid-tbody {
      overflow-y: auto;
      flex: 1;
    }

    .grid-tr {
      display: flex;
      transition: background .15s;
      background-color: #060c21;
    }

    .grid-tr:hover {
      background: rgba(59, 70, 137, .18);
    }

    .grid-tr:last-child .grid-td {
      border-bottom: none;
    }

    .grid-td {
      padding: 4px 6px;
      font-size: 13px;
      color: var(--td-color);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .col-left {
      justify-content: flex-start;
      text-align: left;
    }

    .col-right {
      justify-content: flex-end;
      text-align: right;
    }

    .grid-td:last-child {
      border-right: none;
    }

    /* ── Spec table column widths ── */
    .spec-col-stt {
      flex: 0 0 60px;
      min-width: 60px;
    }

    /* giữ nguyên */
    .spec-col-type {
      flex: 1 1 0;
      min-width: 0;
    }

    .spec-col-mobis {
      flex: 1 1 0;
      min-width: 0;
    }

    .spec-col-partron {
      flex: 1 1 0;
      min-width: 0;
    }

    .spec-col-name {
      flex: 1 1 0;
      min-width: 0;
    }

    .spec-col-actions {
      flex: 1 1 0;
      min-width: 0;
    }

    /* ── Delivery table column widths ── */
    .del-col-stt {
      flex: 0 0 60px;
      min-width: 60px;
    }

    .del-col-modelid {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-mobis {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-name {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-type {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-target {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-qty {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-status {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-complete {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-shipdate {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-shipmethod {
      flex: 1 1 0;
      min-width: 0;
    }

    .del-col-actions {
      flex: 1 1 0;
      min-width: 0;
    }

    .spec-grid-body {
      flex: 1;
      min-height: 0;
    }

    .delivery-grid-body {
      flex: 1;
      min-height: 0;
    }

    /* ── Buttons ── */
    .edit-user,
    .delete-user,
    .edit-model,
    .delete-model {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 5px 10px;
      margin: 2px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: all .3s ease;
    }

    .edit-user:hover,
    .delete-user:hover,
    .edit-model:hover,
    .delete-model:hover {
      background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
    }

    .add-user {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all .3s ease;
    }

    .add-user:hover {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
    }

    .import,
    .export,
    .add-spec {
      background: none;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all .3s ease;
    }

    .import:hover,
    .export:hover,
    .add-spec:hover {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 10px;
      color: #9ca3af;
      pointer-events: none;
      flex-shrink: 0;
    }

    body.light-theme .search-wrap .search-icon {
      color: #6b7280;
    }

    .search-wrap .searchText {
      padding-left: 32px;
    }

    .searchText {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      width: 200px;
      background: rgba(255, 255, 255, .1);
      color: white;
      font-size: 14px;
    }

    .searchText::placeholder {
      color: #d1d5db;
    }

    .searchText:focus {
      outline: none;
      background: rgba(255, 255, 255, .2);
    }

    .edit-input {
      background: rgba(255, 255, 255, .9);
      border: 1px solid #667eea;
      border-radius: 4px;
      padding: 5px 7px;
      color: #333;
      font-size: 12px;
      width: 100%;
      min-width: 70px;
    }

    .edit-input:focus {
      outline: none;
      border-color: #764ba2;
      background: white;
    }

    /* ── Factory select / date ── */
    #factorySelect {
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      background: rgba(255, 255, 255, .1);
      color: white;
      font-size: 14px;
    }

    #factorySelect:focus {
      outline: none;
      background: rgba(255, 255, 255, .2);
    }

    #factorySelect option {
      background-color: #2b2b2bb7;
      color: white;
    }

    #clearFilters {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all .3s ease;
    }

    #clearFilters:hover {
      background: linear-gradient(135deg, #05855c 0%, #225ad3 100%);
    }

    .date-filter {
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      background: rgba(255, 255, 255, .1);
      color: white;
      font-size: 14px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    .date-range-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .date-range-input {
      cursor: pointer;
      min-width: 170px;
      caret-color: transparent;
      user-select: none;
    }

    .date-range-hidden {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      top: 0;
      left: 0;
    }

    /* ── Badges ── */
    .role-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 13px;
      text-align: center;
    }

    .role-badge.manager {
      background-color: rgba(0, 128, 0, .5);
      color: white;
      border: 1px solid #159957;
    }

    .role-badge.user {
      background-color: rgba(255, 165, 0, .5);
      color: white;
      border: 1px solid #f5af19;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 13px;
      text-align: center;
    }

    .status-badge.complete {
      background-color: rgba(0, 128, 0, .5);
      color: white;
      border: 1px solid #159957;
    }

    .status-badge.wait {
      background-color: rgba(255, 165, 0, .5);
      color: white;
      border: 1px solid #f5af19;
    }

    .status-badge.run {
      background-color: rgba(109, 213, 237, .5);
      color: white;
      border: 1px solid #0083B0;
    }

    .bottom-row3 {
      display: flex;
      flex-direction: column;
      color: white;
      flex-wrap: wrap;
      margin: 10px;
    }
  </style>
</head>

<body>
  <app-header active="management"></app-header>

  <div class="all">
    <div class="container">
      <!-- Hàng 1: Overview & Charts -->
      <div class="top-row">
        <div class="welcome-card">
          <div class="welcome-left">
            <div class="welcome-text">
              <h2 id="welcome">Welcome back, Admin!</h2>
              <div class="stats">
                <div>
                  <strong id="totalInDay"></strong>
                  <span id="lbl-total-in-day">Total in day</span>
                </div>
                <div class="divider"></div>
                <div>
                  <strong id="performance"></strong>
                  <span id="lbl-performance">Performance</span>
                </div>
              </div>
            </div>
          </div>
          <div class="welcome-right">
            <img src="/images/admin.svg" alt="user" />
          </div>
        </div>
        <div class="chart-row">
          <div class="chart-card">
            <div class="chart-header">
              <h3 id="lbl-chart-monthly-title"></h3>
              <p id="lbl-chart-monthly-sub"></p>
            </div>
            <div class="chart-container">
              <div id="monthlyChart"></div>
            </div>
          </div>
          <div class="chart-card">
            <div class="chart-header">
              <h3 id="lbl-chart-status-title"></h3>
              <p id="lbl-chart-status-sub"></p>
            </div>
            <div class="chart-container">
              <div id="orderChart"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Hàng 2: Model Spec -->
      <div class="bottom-row">
        <div class="grid-table-wrap">

          <!-- Toolbar -->
          <div class="grid-toolbar">
            <span class="grid-toolbar-title" id="th-model-spec"></span>
            <div class="search-wrap">
              <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input class="searchText" type="text" id="searchText" />
            </div>
            <button class="add-spec" id="btn-add-spec"></button>
            <button class="import" id="importButton"></button>
            <button class="export" id="exportButton"></button>
          </div>

          <!-- Header -->
          <div class="grid-thead">
            <div class="grid-row">
              <div class="grid-th spec-col-stt" id="th-spec-stt">STT</div>
              <div class="grid-th spec-col-type" id="th-spec-modelType">Model Type</div>
              <div class="grid-th spec-col-mobis" id="th-spec-mobisCode">Mobis Code</div>
              <div class="grid-th spec-col-partron" id="th-spec-partronCode">Partron Code</div>
              <div class="grid-th spec-col-name" id="th-spec-modelName">Model Name</div>
              <div class="grid-th spec-col-actions" id="th-spec-actions">Actions</div>
            </div>
          </div>

          <!-- Body -->
          <div class="grid-tbody spec-grid-body" id="specTableBody"></div>
        </div>
      </div>
    </div>

    <!-- Hàng 3: Delivery -->
    <div class="bottom-row3">
      <div class="grid-table-wrap">

        <!-- Toolbar -->
        <div class="grid-toolbar">
          <span class="grid-toolbar-title" id="th-delivery"></span>
          <select id="factorySelect">
            <option value="V0" selected>V0</option>
            <option value="V5">V5</option>
          </select>
          <div class="search-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input class="searchText" type="text" id="searchTextDelivery" />
          </div>
          <div class="date-range-wrap">
            <input type="text" id="deliveryDateRangeText" class="date-filter date-range-input" readonly
              placeholder="Chọn khoảng ngày">
            <input type="date" id="deliveryDateFrom" class="date-range-hidden">
            <input type="date" id="deliveryDateTo" class="date-range-hidden">
          </div>
          <button id="clearFilters">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>
        </div>

        <!-- Header -->
        <div class="grid-thead">
          <div class="grid-row">
            <div class="grid-th del-col-stt" id="th-del-stt">STT</div>
            <div class="grid-th del-col-mobis" id="th-del-mobisCode">Mobis Code</div>
            <div class="grid-th del-col-name" id="th-del-modelName">Model Name</div>
            <div class="grid-th del-col-type" id="th-del-type">Type</div>
            <div class="grid-th del-col-target" id="th-del-target">Target</div>
            <div class="grid-th del-col-qty" id="th-del-quantity">Quantity</div>
            <div class="grid-th del-col-status" id="th-del-status">Status</div>
            <div class="grid-th del-col-shipdate" id="th-del-shippingDate">Shipping Date</div>
            <div class="grid-th del-col-shipmethod" id="th-del-shippingMethod">Shipping Method</div>
            <div class="grid-th del-col-actions" id="th-del-actions">Actions</div>
          </div>
        </div>

        <!-- Body -->
        <div class="grid-tbody delivery-grid-body" id="DeliveryTableBody"></div>
      </div>
    </div>
  </div>

  <script src="/js/dayjs.min.js"></script>
