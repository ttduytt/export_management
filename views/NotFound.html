<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Không tìm thấy trang</title>
  <style>
    :root{
      --bg1: #0f172a;
      --bg2: #0b1220;
      --accent: #60a5fa;
      --muted: #94a3b8;
      --card: rgba(255,255,255,0.03);
      --glass: rgba(255,255,255,0.04);
      --shadow: 0 8px 30px rgba(2,6,23,0.6);
      --radius: 14px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(circle at 10% 10%, rgba(96,165,250,0.06), transparent 8%),
                  linear-gradient(160deg,var(--bg1),var(--bg2));
      color: #e6eef8;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .card{
      width:min(980px, 96%);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 40px);
      display:grid;
      grid-template-columns: 1fr 420px;
      gap: clamp(16px, 3vw, 32px);
      align-items:center;
    }

    /* responsive: stack on small screens */
    @media (max-width:880px){
      .card{grid-template-columns:1fr; text-align:center}
      .illustration{order:-1}
    }

    .left{
      padding-right:12px;
    }

    h1{
      font-size: clamp(34px, 5vw, 52px);
      margin:0 0 8px 0;
      letter-spacing: -1px;
      line-height:1;
      color: white;
      display:flex;
      align-items:baseline;
      gap:14px;
    }
    .code{
      font-weight:700;
      font-size: clamp(46px, 8vw, 72px);
      color: var(--accent);
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      padding:8px 14px;
      border-radius:10px;
      box-shadow: 0 6px 18px rgba(96,165,250,0.08);
    }

    p.lead{
      color:var(--muted);
      margin:12px 0 20px 0;
      font-size: clamp(14px, 2.2vw, 16px);
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      padding:10px 16px;
      border-radius:10px;
      font-weight:600;
      font-size:15px;
      backdrop-filter: blur(6px);
      transition:transform .18s ease, box-shadow .18s ease;
      box-shadow:none;
    }
    .btn:active{transform:translateY(1px)}
    .btn-primary{
      background: linear-gradient(90deg,var(--accent), #3b82f6);
      color:#07203a;
      box-shadow: 0 8px 24px rgba(59,130,246,0.18);
    }
    .btn-ghost{
      background:transparent;
      color:var(--accent);
      border:1px solid rgba(96,165,250,0.16);
    }

    /* small meta info */
    .meta{
      margin-top:18px;
      color: rgba(230,238,248,0.65);
      font-size:13px;
    }

    /* right illustration */
    .illustration{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:6px;
    }

    .scene{
      width:100%;
      max-width:360px;
      aspect-ratio:1.1/1;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.02);
    }

    /* simple SVG robot/astronaut */
    .scene svg{width:100%;height:auto;display:block;transform-origin:center;animation:float 6s ease-in-out infinite}

    @keyframes float{
      0%{transform:translateY(0)}
      50%{transform:translateY(-10px) rotate(-1deg)}
      100%{transform:translateY(0)}
    }

    /* subtle stars */
    .scene::before{
      content:"";
      position:absolute;
      inset:0;
      background-image: radial-gradient(circle at 10% 20%, rgba(255,255,255,0.02) 0, transparent 6%),
                        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.01) 0, transparent 6%);
      pointer-events:none;
    }

    footer.foot{
      width:100%;
      margin-top:18px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:center;
      color:var(--muted);
      font-size:13px;
    }
    @media (max-width:880px){
      footer.foot{flex-direction:column;gap:6px}
    }
    a.link{
      color:var(--accent);
      text-decoration:none;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <section class="left" aria-label="Thông báo lỗi">
      <h1 id="title">
        <span class="code">404</span>
        <span>Không tìm thấy trang</span>
      </h1>
      <p class="lead">Trang bạn vừa yêu cầu không tồn tại hoặc đã được di chuyển. Có thể đường dẫn bị gõ sai hoặc trang đã bị xóa.</p>

      <div class="actions" role="group" aria-label="Hành động">
        <button class="btn btn-primary" onclick="location.href='/'" title="Về trang chủ">Về trang chủ</button>
        <button class="btn btn-ghost" onclick="history.back()" title="Quay lại">Quay lại</button>
      </div>
    </section>

    <aside class="illustration" aria-hidden="true">
      <div class="scene" role="img" aria-label="Minh họa 404">
        <!-- Simple friendly astronaut SVG illustration -->
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="#60a5fa"/>
              <stop offset="1" stop-color="#3b82f6"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" rx="10" fill="url(#g1)" opacity="0.06"/>
          <g transform="translate(18,12) scale(0.9)">
            <g transform="translate(60,38)">
              <circle cx="40" cy="40" r="40" fill="#091423"/>
              <circle cx="40" cy="40" r="28" fill="#0b1a2b"/>
              <rect x="14" y="60" width="52" height="24" rx="6" fill="#0b1a2b" transform="rotate(-8 40 72)"/>
              <circle cx="32" cy="36" r="6" fill="#e6f0ff" opacity="0.9"/>
              <circle cx="48" cy="36" r="3" fill="#a6c8ff" opacity="0.9"/>
              <path d="M8 74 C20 84, 60 84, 72 74" stroke="#cfe6ff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.18"/>
            </g>
            <!-- floating ring -->
            <g transform="translate(10,10) rotate(-15)">
              <ellipse cx="18" cy="8" rx="36" ry="8" fill="rgba(255,255,255,0.03)"/>
            </g>
          </g>
        </svg>
      </div>
    </aside>
  </main>

</body>
</html>
