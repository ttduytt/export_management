<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon" />
    <script type="module" src="/js/main.js"></script>
    <script type="module" src="/js/header.js"></script>
    <title>Language Management</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #040818;
        }

        body.light-theme {
            background-color: #f0f4f8;
            color: #333;
        }

        body.light-theme .data-panel {
            background: white;
            border-color: #ccc;
        }

        body.light-theme .toolbar {
            background-color: #2980b9;
        }

        body.light-theme .table-header {
            background-color: #2980b9;
            color: white;
        }

        body.light-theme .tl-row {
            color: #333;
            border-bottom: 1px solid #ccc;
        }

        body.light-theme .tl-row:hover {
            background: #f0f4f8;
        }

        body.light-theme .tl-row.active {
            background: #dbeafe;
        }

        body.light-theme .editor-wrapper {
            background: white;
            border-color: #ccc;
        }

        body.light-theme .editor-header {
            background-color: #2980b9;
        }

        body.light-theme .field-readonly {
            background: #f0f4f8;
            border: 1px solid #ccc;
            color: #2193b0;
        }

        body.light-theme textarea.field-input {
            background: #f8fafc;
            border: 1px solid #ccc;
            color: #333;
        }

        body.light-theme textarea.field-input:focus {
            border-color: #2193b0;
            box-shadow: 0 0 0 3px rgba(33, 147, 176, .12);
        }

        body.light-theme .field-label {
            color: #6b7280;
        }

        body.light-theme .editor-actions {
            border-top-color: #e5e7eb;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #060c21;
        }

        ::-webkit-scrollbar-thumb {
            background: #3b4689;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a56a0;
        }

        body.light-theme ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        body.light-theme ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
        }

        .page-wrapper {
            display: flex;
            flex-direction: row;
            gap: 16px;
            margin: 16px 40px;
            height: calc(100vh - 121px);
        }

        .data-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #060c21;
            border: 1px solid #3b4689;
            border-radius: 10px;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: #3b4689;
            flex-shrink: 0;
            gap: 12px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar-title {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: .13em;
            text-transform: uppercase;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .search-wrap {
            position: relative;
        }

        .search-wrap .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #d1d5db;
        }

        .search-input {
            padding: 6px 30px 6px 34px;
            width: 260px;
            height: 32px;
            border: none;
            font-size: 14px;
            border-radius: 4px;
            background: rgba(255, 255, 255, .1);
            color: white;
            outline: none;
            transition: background .2s;
        }

        .search-input::placeholder {
            color: #d1d5db;
        }

        .search-input:focus {
            background: rgba(255, 255, 255, .18);
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #d1d5db;
            display: none;
            align-items: center;
            transition: color .2s;
            padding: 2px;
        }

        .search-clear:hover {
            color: #fff;
        }

        .search-clear.visible {
            display: flex;
        }

        .btn {
            padding: 7px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .05em;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: all .2s;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-import {
            background: #8f8ca3;
            text-transform: none;
            color: white;
        }

        .btn-import:hover:not(:disabled) {
            background: linear-gradient(90deg, #2193b0, #6dd5ed);
            box-shadow: 0 4px 14px rgba(33, 147, 176, .35);
        }

        .btn-export {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            text-transform: none;
            color: white;
        }

        .btn-export:hover:not(:disabled) {
            opacity: .88;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(59, 130, 246, .35);
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none !important;
        }

        .table-header {
            display: grid;
            grid-template-columns: 64px 210px 1fr 1fr 1fr;
            align-items: center;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #fff;
            background: #3b4689;
            flex-shrink: 0;
        }

        .table-scroll {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
        }

        .tl-row {
            display: grid;
            grid-template-columns: 64px 210px 1fr 1fr 1fr;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a3a;
            color: #e3e2e9;
            cursor: pointer;
            transition: background .12s;
        }

        .tl-row:hover {
            background: rgba(59, 70, 137, .18);
        }

        .tl-row.active {
            background: rgba(59, 70, 137, .42);
            border-left: 3px solid #667eea;
        }

        /* MỚI */
        .col-key,
        .col-lang,
        .col-no {
            font-size: 13px;
            font-weight: 600;
            color: white;
            overflow: hidden;
            padding: 0 6px;
            text-align: center;
        }

        /* Chỉ căn trái ở data row, không ảnh hưởng table-header */
        .tl-row .col-key,
        .tl-row .col-lang {
            text-align: left;
        }

        .cell-text {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            padding: 32px;
            text-align: center;
            color: #4e4d66;
            font-size: 13px;
        }

        .editor-wrapper {
            width: 380px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #060c21;
            border: 1px solid #3b4689;
            border-radius: 10px;
            overflow: hidden;
        }

        .editor-header {
            padding: 14px 20px;
            background: #3b4689;
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .editor-body {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            flex: 1;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #8f8ca3;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .field-label .required {
            color: #f87171;
        }

        .field-readonly {
            background: rgba(0, 0, 0, .35);
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #6dd5ed;
            min-height: 36px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        textarea.field-input {
            width: 100%;
            background: #0a1030;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            color: #e3e2e9;
            resize: none;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            line-height: 1.5;
        }

        textarea.field-input::placeholder {
            color: #4e4d66;
        }

        textarea.field-input:focus {
            border-color: #2193b0;
            box-shadow: 0 0 0 3px rgba(33, 147, 176, .14);
        }

        textarea.field-input.has-error {
            border-color: rgba(248, 113, 113, .6);
        }

        textarea.field-input.has-error:focus {
            box-shadow: 0 0 0 3px rgba(248, 113, 113, .12);
        }

        .field-error {
            font-size: 11px;
            color: #f87171;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .field-error.visible {
            display: flex;
        }

        .error-banner {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(248, 113, 113, .08);
            border: 1px solid rgba(248, 113, 113, .25);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #f87171;
        }

        .error-banner.visible {
            display: flex;
        }

        .editor-actions {
            padding: 14px 20px;
            border-top: 1px solid #2a2a3a;
            flex-shrink: 0;
        }

        .btn-save {
            width: 100%;
            padding: 10px 0;
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .07em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all .2s;
            box-shadow: 0 4px 16px rgba(16, 185, 129, .2);
        }

        .btn-save:hover:not(:disabled) {
            opacity: .88;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, .3);
        }

        .btn-save:disabled {
            opacity: .4;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, .2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex-shrink: 0;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #toast {
            position: fixed;
            bottom: 28px;
            right: 32px;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .04em;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 9999;
        }

        #toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #toast.success {
            background: #0e2e20;
            border: 1px solid #10b981;
            color: #4ade80;
        }

        #toast.error {
            background: #2e0e0e;
            border: 1px solid #f87171;
            color: #fca5a5;
        }

        footer {
            color: white;
            font-size: 12px;
            text-align: right;
            padding: 8px 20px;
            position: fixed;
            bottom: 0;
            right: 0;
            width: 100%;
        }
    </style>
</head>

<body>

    <app-header active="translations"></app-header>

    <div class="page-wrapper">

        <!-- Bảng data -->
        <div class="data-panel">
            <div class="toolbar">
                <div class="toolbar-left">
                    <div class="toolbar-title">
                        <span id="tl-toolbar-title">Language Management</span>
                    </div>
                    <div class="search-wrap">
                        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8" />
                            <path d="m21 21-4.3-4.3" />
                        </svg>
                        <input id="searchInput" class="search-input" type="text" placeholder="Search VI / EN / KR..." />
                        <button id="searchClear" class="search-clear" title="Xóa">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 6 6 18" />
                                <path d="m6 6 12 12" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none" />
                    <button class="btn btn-import" id="importBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" x2="12" y1="3" y2="15" />
                        </svg>
                        <span id="tl-import-text">Nhập Excel</span>
                    </button>
                    <button class="btn btn-export" id="exportBtn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" x2="12" y1="15" y2="3" />
                        </svg>
                        <span id="tl-export-text">Xuất Excel</span>
                    </button>
                </div>
            </div>

            <!-- Table header -->
            <div class="table-header">
                <div class="col-no" id="th-tl-no"></div>
                <div class="col-key" id="th-tl-key">DESCRIPTION</div>
                <div class="col-lang">VI</div>
                <div class="col-lang">EN</div>
                <div class="col-lang">KR</div>
            </div>

            <div class="table-scroll" id="tableScroll">
                <div class="empty-state" id="tl-loading-state">
                    <div class="spinner" style="margin:0 auto 8px;"></div>
                    <span id="tl-loading-text">Đang tải dữ liệu...</span>
                </div>
            </div>
        </div>

        <!-- Editor panel -->
        <div class="editor-wrapper" id="editorWrapper">
            <div class="editor-header">
                <span id="tl-editor-title">Trình chỉnh sửa</span>
            </div>

            <div class="editor-body">
                <div class="error-banner" id="errorBanner">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" x2="12" y1="8" y2="12" />
                        <line x1="12" x2="12.01" y1="16" y2="16" />
                    </svg>
                    <span id="errorText"></span>
                </div>

                <div class="field">
                    <div class="field-label" id="tl-lbl-description">Description</div>
                    <div class="field-readonly" id="fieldDescription"></div>
                </div>

                <div class="field">
                    <div class="field-label">VI <span class="required">*</span></div>
                    <textarea class="field-input" id="fieldVi" rows="3"
                        placeholder="Nhập nội dung tiếng Việt..."></textarea>
                    <div class="field-error" id="errVi">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" x2="12" y1="8" y2="12" />
                            <line x1="12" x2="12.01" y1="16" y2="16" />
                        </svg>
                        <span id="tl-err-vi-text">Trường này không được để trống</span>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">EN <span class="required">*</span></div>
                    <textarea class="field-input" id="fieldEn" rows="3"
                        placeholder="Enter English content..."></textarea>
                    <div class="field-error" id="errEn">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" x2="12" y1="8" y2="12" />
                            <line x1="12" x2="12.01" y1="16" y2="16" />
                        </svg>
                        <span id="tl-err-en-text">Trường này không được để trống</span>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">KR <span class="required">*</span></div>
                    <textarea class="field-input" id="fieldKr" rows="3" placeholder="한국어 내용 입력..."></textarea>
                    <div class="field-error" id="errKr">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" x2="12" y1="8" y2="12" />
                            <line x1="12" x2="12.01" y1="16" y2="16" />
                        </svg>
                        <span id="tl-err-kr-text">Trường này không được để trống</span>
                    </div>
                </div>
            </div>

            <div class="editor-actions">
                <button class="btn-save" id="btnSave">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    <span id="tl-save-text">Lưu thay đổi</span>
                </button>
            </div>
        </div>

    </div>

    <div id="toast"></div>
    <script type="module" src="/js/translations.js"></script>
</body>

</html>
