<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
  <script src="/js/highcharts.js"></script>
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/dashboard.js"></script>
  <title>Delivery Management - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #040818;
    }

    :root {
      --card-bg: linear-gradient(135deg, rgba(102, 126, 234, .25) 0%, rgba(118, 75, 162, .25) 100%);
      --thead-bg: #3b4689;
      --thead-border: rgba(255, 255, 255, 0.25);
      --thead-color: #ffffff;
      --tbody-border: rgba(255, 255, 255, 0.12);
      --td-color: #ffffff;
    }

    body.light-theme {
      background-color: white;
      color: #1f2937;
      --card-bg: linear-gradient(135deg, #e0e7ff 0%, #dbeafe 100%);
      --thead-bg: #1a5276;
      --thead-border: rgba(255, 255, 255, 0.3);
      --thead-color: #ffffff;
      --tbody-border: rgba(0, 0, 0, 0.12);
      --td-color: #1f2937;
    }

    body.light-theme .welcome-card {
      background: linear-gradient(135deg, #e0e7ff 0%, #dbeafe 100%);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    body.light-theme .welcome-text h2 {
      color: #1f2937;
    }

    body.light-theme .stats strong,
    body.light-theme .stats span {
      color: #1f2937;
    }

    body.light-theme .divider {
      background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
    }

    body.light-theme .kpi-card {
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }

    body.light-theme .kpi-value {
      color: #1f2937;
    }

    body.light-theme .kpi-label {
      color: #6b7280;
    }

    body.light-theme .chart-card {
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }

    body.light-theme .chart-header h3 {
      color: #1f2937;
    }

    body.light-theme .chart-header p {
      color: #6b7280;
    }

    body.light-theme .top-models-card {
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }

    body.light-theme .top-models-title {
      color: #1f2937;
    }

    body.light-theme .top-models-table th {
      background-color: #1a5276;
    }

    body.light-theme .top-models-table td {
      color: #1f2937;
      border-bottom: 1px solid #e5e7eb;
    }

    body.light-theme .top-models-table tr:hover td {
      background: #f0f7ff;
    }

    body.light-theme .progress-bar-bg {
      background: #e5e7eb;
    }

    body.light-theme .highcharts-title,
    body.light-theme .highcharts-subtitle,
    body.light-theme .highcharts-axis-labels text,
    body.light-theme .highcharts-legend-item text,
    body.light-theme .highcharts-data-label text,
    body.light-theme .highcharts-label text {
      fill: #1f2937 !important;
    }

    body.light-theme .highcharts-axis-line,
    body.light-theme .highcharts-tick {
      stroke: #9ca3af !important;
    }

    body.light-theme .highcharts-grid-line {
      stroke: #e5e7eb !important;
    }

    /* ── Layout ── */
    .dashboard-container {
      padding: 10px 20px 40px;
    }

    /* ── Row 1: Welcome + KPI ── */
    .row-welcome {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      align-items: stretch;
    }

    .welcome-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px 24px;
      flex: 1;
      min-width: 0;
    }

    .welcome-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .welcome-text h2 {
      font-size: 20px;
      color: #fff;
      margin-bottom: 20px;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .stats div {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .stats strong {
      font-size: 26px;
      font-weight: 600;
      color: #fff;
    }

    .stats span {
      color: #fff;
      font-size: 14px;
    }

    .divider {
      width: 1px;
      height: 30px;
      background: linear-gradient(135deg, rgba(102, 126, 234, .25) 0%, rgba(118, 75, 162, .25) 100%);
    }

    .welcome-right img {
      width: 100%;
      max-width: 300px;
    }

    .kpi-row {
      display: flex;
      gap: 12px;
      flex: 1;
    }

    .kpi-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .kpi-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .kpi-icon.blue {
      background: rgba(59, 130, 246, 0.2);
    }

    .kpi-icon.green {
      background: rgba(16, 185, 129, 0.2);
    }

    .kpi-icon.purple {
      background: rgba(139, 92, 246, 0.2);
    }

    .kpi-icon.orange {
      background: rgba(245, 158, 11, 0.2);
    }

    .kpi-info {
      min-width: 0;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .kpi-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Row 2: Charts ── */
    .row-charts {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .chart-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
    }

    .chart-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 8px;
    }

    .chart-header p {
      font-size: 14px;
      color: #6b7280;
      margin: 0 0 20px;
    }

    .chart-container {
      width: 100%;
      height: 300px;
      position: relative;
    }

    .chart-container div {
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Row 3: Top Models ── */
    .top-models-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      color: #fff;
    }

    .top-models-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .top-models-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .top-models-badge {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      color: white;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .top-models-table {
      width: 100%;
      border-collapse: collapse;
    }

    .top-models-table th {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-transform: uppercase;
      text-align: left;
      background-color: var(--thead-bg);
      border-bottom: 2px solid var(--thead-border);
    }

    .top-models-table th:first-child {
      border-radius: 8px 0 0 0;
      text-align: center;
      width: 50px;
    }

    .top-models-table th:last-child {
      border-radius: 0 8px 0 0;
    }

    .top-models-table td {
      padding: 10px 14px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .top-models-table td:first-child {
      text-align: center;
      font-weight: 700;
    }

    .top-models-table tr:hover td {
      background: rgba(59, 70, 137, 0.18);
    }

    .top-models-table tr:last-child td {
      border-bottom: none;
    }

    .rank-default {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.7);
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      min-width: 80px;
    }

    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #10b981, #3b82f6);
      transition: width 0.6s ease;
    }

    .total-qty {
      font-weight: 600;
      color: #10b981;
      font-size: 15px;
    }

    .no-data-row td {
      text-align: center !important;
      padding: 40px 14px;
      color: rgba(255, 255, 255, 0.4);
      font-style: italic;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .row-welcome {
        flex-direction: column;
      }

      .kpi-row {
        flex: 1;
      }

      .row-charts {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <app-header active="dashboard"></app-header>

  <div class="dashboard-container">

    <!-- Row 1: Welcome + KPI -->
    <div class="row-welcome">
      <div class="welcome-card">
        <div class="welcome-left">
          <div class="welcome-text">
            <h2 id="welcome">Welcome back, Admin!</h2>
            <div class="stats">
              <div>
                <strong id="totalInDay"></strong>
                <span id="lbl-total-in-day">Total in day</span>
              </div>
              <div class="divider"></div>
              <div>
                <strong id="performance"></strong>
                <span id="lbl-performance">Complete</span>
              </div>
            </div>
          </div>
        </div>
        <div class="welcome-right">
          <img src="/images/admin.svg" alt="user" />
        </div>
      </div>
    </div>

    <!-- Row 2: Charts -->
    <div class="row-charts">
      <div class="chart-card">
        <div class="chart-header">
          <h3 id="lbl-chart-monthly-title">Monthly Performance</h3>
          <p id="lbl-chart-monthly-sub">Export count over the last 6 months</p>
        </div>
        <div class="chart-container">
          <div id="monthlyChart"></div>
        </div>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <h3 id="lbl-chart-status-title">Shipment Status</h3>
          <p id="lbl-chart-status-sub">Current order status distribution</p>
        </div>
        <div class="chart-container">
          <div id="orderChart"></div>
        </div>
      </div>
    </div>

    <!-- Row 3: Top Exported Models -->
    <div class="top-models-card">
      <div class="top-models-header">
        <span class="top-models-title" id="lbl-top-models-title">Top Exported Models This Month</span>
        <span class="top-models-badge" id="topModelsBadge">0 models</span>
      </div>
      <table class="top-models-table">
        <thead>
          <tr>
            <th>#</th>
            <th id="th-top-modelType">Model Type</th>
            <th id="th-top-mobisCode">Mobis Code</th>
            <th id="th-top-modelName">Model Name</th>
            <th id="th-top-total">Total Exported</th>
          </tr>
        </thead>
        <tbody id="topModelsBody">
          <tr class="no-data-row">
            <td colspan="5">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="/js/dayjs.min.js"></script>
</body>

</html>
