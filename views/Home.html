<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon" />
  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/header.js"></script>
  <title>Delivery Management - Home</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #040818;
    }

    /* ── Light theme ─────────────────────────────────────────────────── */
    body.light-theme { background-color: white; color: #e3e2e9; }
    body.light-theme nav { background: linear-gradient(to right,#667db6,#0082c8,#0082c8,#667db6); }
    body.light-theme .nav-menu li a.active { background:#2a8f9e; box-shadow:0 4px 15px rgba(102,126,234,.3); color:white; }
    body.light-theme .nav-menu li a:hover  { background:#2a8f9e; color:white; transform:translateY(-2px); }
    body.light-theme .nav-menu li a        { color:white; }
    body.light-theme .logo a               { color:white; }
    body.light-theme .nav-menu li a::before{ background:#6dd5ed; }
    body.light-theme .container            { background:white; }
    body.light-theme .text-wrapper h1      { color:black; }
    body.light-theme .text-wrapper h1::after { color:black; }
    body.light-theme .typing-sub           { background:#2a8f9e; }

    /* ── Container & layout ──────────────────────────────────────────── */
    .container {
      display: flex;
      align-items: center;
      height: calc(100vh - 80px);
      padding: 0 60px;
      gap: 40px;
    }

    /* ── Left content ────────────────────────────────────────────────── */
    .content-left { flex: 1; min-width: 0; }

    /* ── Typing title ────────────────────────────────────────────────── */
    .text-wrapper h1 {
      font-size: 32px;
      font-weight: 700;
      color: #e3e2e9;
      margin-bottom: 28px;
      line-height: 1.4;
      min-height: 1.4em; /* giữ chiều cao khi chưa có text */
    }

    /* Cursor nhấp nháy gắn sau chữ */
    .text-wrapper h1::after {
      content: '|';
      color: #e3e2e9;
      font-weight: 300;
      margin-left: 2px;
      animation: blink-cursor 0.75s step-end infinite;
    }

    .text-wrapper h1.hide-cursor::after {
      display: none;
    }

    @keyframes blink-cursor {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Slogans — NGANG (3 cột) ─────────────────────────────────────── */
    .slogan-row {
      display: flex;
      flex-direction: row;   /* ← nằm ngang */
      flex-wrap: wrap;
      gap: 12px;
    }

    .typing-sub {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #3b4689;
      color: #e3e2e9;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      flex: 1;
      min-width: 200px;
      /* Fade-in từ dưới lên — JS thêm class .visible */
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .typing-sub.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Right content ───────────────────────────────────────────────── */
    .content-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      overflow: hidden;
    }

    .vertical-slider {
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
    }

    .slide-track {
      display: flex;
      will-change: transform;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .slide-track img {
      width: 80%;
      max-width: 600px;
      margin: 20px 0;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(102,126,234,.3);
    }

    /* ── Change Password Modal ───────────────────────────────────────── */
    .cp-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(5,10,30,.75); backdrop-filter: blur(6px);
      z-index: 9999; align-items: center; justify-content: center;
    }
    .cp-overlay.active { display: flex; }
    .cp-modal {
      background: #1a2a5e; border: 1px solid #2e4080;
      border-radius: 16px; padding: 32px; width: 440px; max-width: 95vw;
      position: relative;
      box-shadow: 0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(99,179,255,.08);
      animation: cpSlideIn .25s ease; color: #e8eeff;
    }
    @keyframes cpSlideIn {
      from { opacity:0; transform:translateY(-18px) scale(.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    .cp-close {
      position:absolute; top:14px; right:16px;
      background:none; border:none; font-size:22px;
      cursor:pointer; color:#7a8fcc; line-height:1; transition:color .2s;
    }
    .cp-close:hover { color:#e8eeff; }
    .cp-header { display:flex; align-items:center; gap:14px; margin-bottom:22px; }
    .cp-avatar {
      width:54px; height:54px; border-radius:50%;
      background:linear-gradient(135deg,#1de9c4,#0ea5e9);
      display:flex; align-items:center; justify-content:center;
      color:#0d1b3e; flex-shrink:0; box-shadow:0 0 16px rgba(29,233,196,.35);
    }
    .cp-header h2 { font-size:1.2rem; font-weight:700; margin:0; color:#fff; letter-spacing:.02em; }
    .cp-info-grid {
      display:flex; flex-direction:column; gap:10px;
      background:rgba(10,20,60,.55); border:1px solid #2a3f7e;
      border-radius:12px; padding:16px 18px;
    }
    .cp-info-item  { display:flex; justify-content:space-between; align-items:center; }
    .cp-label  { font-size:.78rem; font-weight:600; color:#6b83c4; text-transform:uppercase; letter-spacing:.06em; }
    .cp-value  { font-size:.95rem; font-weight:600; color:#dde6ff; }
    .cp-badge  {
      background:linear-gradient(135deg,#1de9c4,#0ea5e9); color:#0a1628;
      font-size:.72rem; font-weight:800; padding:3px 12px;
      border-radius:20px; letter-spacing:.07em; text-transform:uppercase;
    }
    .cp-divider { border:none; border-top:1px solid #2a3f7e; margin:20px 0; }
    .cp-form h3  { font-size:.95rem; font-weight:700; margin:0 0 16px; color:#a0b4e8; text-transform:uppercase; letter-spacing:.06em; }
    .cp-field    { margin-bottom:14px; }
    .cp-field label { display:block; font-size:.8rem; font-weight:600; color:#6b83c4; margin-bottom:6px; }
    .cp-input-wrap { position:relative; display:flex; align-items:center; }
    .cp-input-wrap input {
      width:100%; padding:10px 42px 10px 14px; border:1.5px solid #2a3f7e; border-radius:10px;
      font-size:.95rem; background:rgba(10,20,60,.6); color:#e8eeff; outline:none;
      transition:border-color .2s,box-shadow .2s; box-sizing:border-box;
    }
    .cp-input-wrap input::placeholder { color:#4a5e9a; }
    .cp-input-wrap input:focus { border-color:#1de9c4; box-shadow:0 0 0 3px rgba(29,233,196,.15); }
    .cp-eye {
      position:absolute; right:10px; background:none; border:none; cursor:pointer;
      padding:4px; color:#4a5e9a; display:flex; align-items:center; transition:color .2s;
    }
    .cp-eye:hover { color:#1de9c4; }
    .cp-msg  { min-height:20px; font-size:.85rem; margin:6px 0 10px; font-weight:500; }
    .cp-msg.error   { color:#f87171; }
    .cp-msg.success { color:#4ade80; }
    .cp-btn {
      width:100%; padding:12px; background:linear-gradient(135deg,#1de9c4,#0ea5e9);
      color:#0a1628; border:none; border-radius:10px; font-size:.95rem; font-weight:700;
      cursor:pointer; letter-spacing:.04em; display:flex; align-items:center;
      justify-content:center; gap:8px;
      transition:opacity .2s,transform .15s,box-shadow .2s;
      box-shadow:0 4px 20px rgba(29,233,196,.3);
    }
    .cp-btn:hover:not(:disabled) { opacity:.92; transform:translateY(-2px); box-shadow:0 6px 24px rgba(29,233,196,.45); }
    .cp-btn:active:not(:disabled) { transform:translateY(0); }
    .cp-btn:disabled { opacity:.5; cursor:not-allowed; }
    .cp-spinner {
      width:18px; height:18px; border:2.5px solid rgba(10,22,40,.3);
      border-top-color:#0a1628; border-radius:50%; animation:spin .7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Footer ──────────────────────────────────────────────────────── */
    footer {
      color:white; font-size:12px; text-align:right;
      background-color:transparent; padding:8px 20px;
      position:fixed; bottom:0; right:0; width:100%;
    }

    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .container { flex-direction:column; height:auto; padding:20px; }
      .content-right { height:360px; overflow:hidden; }
      .slogan-row { flex-direction:column; }
      .slide-track img { width:90%; max-width:300px; }
    }
    @media (max-width: 1600px) {
      .text-wrapper h1 { font-size:28px; }
      .typing-sub      { font-size:14px; }
      .slide-track img { width:90%; max-width:300px; }
    }
  </style>
</head>
<body>

  <!-- Change Password Modal -->
  <div id="changePassOverlay" class="cp-overlay">
    <div class="cp-modal">
      <button class="cp-close" id="closeChangePass">&times;</button>
      <div class="cp-header">
        <div class="cp-avatar">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <h2 id="cpModalTitle">Account Settings</h2>
      </div>
      <div class="cp-info-grid">
        <div class="cp-info-item">
          <span class="cp-label" id="cpLabelUsername">Username</span>
          <span class="cp-value" id="cpUsername"></span>
        </div>
        <div class="cp-info-item">
          <span class="cp-label" id="cpLabelFullName">Full Name</span>
          <span class="cp-value" id="cpFullName"></span>
        </div>
        <div class="cp-info-item">
          <span class="cp-label" id="cpLabelRole">Role</span>
          <span class="cp-value"><span class="cp-badge" id="cpRole"></span></span>
        </div>
      </div>
      <hr class="cp-divider"/>
      <div class="cp-form">
        <h3 id="cpFormTitle">Change Password</h3>
        <div class="cp-field">
          <label id="cpLabelNewPass">New Password</label>
          <div class="cp-input-wrap">
            <input type="password" id="cpNewPass" placeholder="Enter new password"/>
            <button class="cp-eye" onclick="togglePass('cpNewPass',this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="cp-field">
          <label id="cpLabelConfirmPass">Confirm Password</label>
          <div class="cp-input-wrap">
            <input type="password" id="cpConfirmPass" placeholder="Confirm new password"/>
            <button class="cp-eye" onclick="togglePass('cpConfirmPass',this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="cp-msg" id="cpMsg"></p>
        <button class="cp-btn" id="cpSubmitBtn" onclick="submitChangePass()">
          <span id="cpBtnText">Update Password</span>
          <span id="cpBtnLoader" class="cp-spinner" style="display:none"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Header — same as delivery -->
  <app-header active="home"></app-header>

  <div class="container">
    <!-- Left -->
    <div class="content-left">
      <div class="text-wrapper">
        <h1 id="welcomeTitle"></h1>
        <div class="slogan-row">
          <p class="typing-sub">
            <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span>
            <span id="slogan1">Precision in Every Shipment - Perfection in Every Delivery.</span>
          </p>
          <p class="typing-sub">
            <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span>
            <span id="slogan2">Delivering Accuracy, Speed, and Quality.</span>
          </p>
          <p class="typing-sub">
            <span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg></span>
            <span id="slogan3">Every Box, a Promise Delivered.</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Right: vertical image slider -->
    <div class="content-right">
      <div class="vertical-slider">
        <div class="slide-track" id="slideTrack">
          <img src="/images/kho1.jpg" alt="Delivery Image"/>
          <img src="/images/kho2.jpg" alt="Delivery Image"/>
          <img src="/images/kho3.jpg" alt="Delivery Image"/>
          <img src="/images/kho4.png" alt="Delivery Image"/>
        </div>
      </div>
    </div>
  </div>

  <footer><p id="footerText">&copy; 2025 Copyright for Partron VN</p></footer>

  <!-- togglePass phải global vì dùng onclick inline -->
  <script>
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      const isText = input.type === "text";
      input.type = isText ? "password" : "text";
      btn.style.opacity = isText ? "1" : ".5";
    }
  </script>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
