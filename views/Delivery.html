<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
    <script type="module" src="/js/main.js"></script>
    <title>Delivery Management - Trang chủ</title>
    <audio id="errorSound" src="/images/errorsound.mp3" preload="auto"></audio>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #040818;
            overflow-x: hidden;
        }

        /* Light mode */
        body.light-theme {
            background-color: white;
            color: #e3e2e9;
        }

        /* nav */
        body.light-theme nav {
            background: linear-gradient(to right, #667db6, #0082c8, #0082c8, #667db6);
        }

        body.light-theme .nav-menu li a.active {
            background: #2a8f9e;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            color: white;
        }

        body.light-theme .nav-menu li a:hover {
            background: #2a8f9e;
            color: white;
            transform: translateY(-2px);
        }

        body.light-theme .nav-menu li a {
            color: white;
        }

        body.light-theme .logo a {
            color: white;
        }

        body.light-theme .nav-menu li a::before {
            background: #6dd5ed;
        }


        /* content*/
        body.light-theme .container {
            background-color: white;
            border: 1px solid #ccc;
        }

        body.light-theme .table-header {
            background-color: #2980b9;
            color: white;
        }

        body.light-theme .table-row {
            border-bottom: 1px solid #ccc;
            color: #333;
            font-weight: 500;
        }

        body.light-theme .grid-view {
            background-color: white;
        }

        body.light-theme .card {
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body.light-theme .card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }


        body.light-theme .table-row.running {
            position: relative;
            background: linear-gradient(white, white) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            border: 2px solid transparent;
            border-radius: 4px;
            animation: borderMove 3s linear infinite;
            background-size: 200% 100%;
        }

        body.light-theme .table-row.running:hover {
            background: linear-gradient(rgba(42, 143, 158, 0.05), rgba(42, 143, 158, 0.05)) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            border: 2px solid transparent;
        }

        /* Sửa lại CSS cho light mode - card running */
        body.light-theme .card.running::after {
            background: white;
            border-radius: 11px;
        }


        body.light-theme .card-header {
            color: black;
        }

        body.light-theme .card-body {
            color: black;
        }

        body.light-theme .card-body strong {
            color: black;
        }

        body.light-theme .card-body span {
            color: black;
        }


        body.light-theme .status-badge.complete {
            background-color: rgba(0, 128, 0, 0.3);
            color: #43955e;
            border: 1px solid #43955e;
        }

        body.light-theme .status-badge.wait {
            background-color: rgba(255, 165, 0, 0.5);
            color: orange;
            border: 1px solid #f5af19;
        }

        body.light-theme .status-badge.run {
            background-color: rgba(109, 213, 237, 0.5);
            color: #2193b0;
            border: 1px solid #0083B0;
        }

        body.light-theme .grid-view::-webkit-scrollbar-track {
            background: #f5f7fa;
        }

        body.light-theme .grid-view::-webkit-scrollbar-thumb {
            background: #c0c0c0;
        }

        body.light-theme .grid-view::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        body.light-theme .list-view::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        body.light-theme .list-view::-webkit-scrollbar-thumb {
            background: #c0c0c0;
        }

        body.light-theme .list-view::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* content */
        body.light-theme .toolbar {
            background-color: #2980B9;
        }

        /* Navigation */
        nav {
            background: rgba(6, 12, 34, 0.95);
            backdrop-filter: blur(10px);
            padding: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: 700;
            padding: 20px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f4f4f4 0%, #e7d3fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo a {
            color: white;
            text-decoration: none;
        }

        .logo img {
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
            align-items: center;
        }

        .nav-menu li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            padding: 12px 28px;
            display: block;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.5px;
            border-radius: 8px;
        }

        .nav-menu li a::before {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: transform 0.3s ease;
        }

        .nav-menu li a:hover {
            background: rgba(102, 126, 234, 0.15);
            color: white;
            transform: translateY(-2px);
        }

        .nav-menu li a:hover::before {
            transform: translateX(-50%) scaleX(1);
        }

        .nav-menu li a.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.25) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .nav-menu li a.active::before {
            transform: translateX(-50%) scaleX(1);
        }

        /* From Uiverse.io by JustCode14 */
        /* The switch - the box around the slider */
        .switch {
            font-size: 17px;
            position: relative;
            display: inline-block;
            width: 4em;
            height: 2.2em;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* The slider */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a2a;
            transition: 0.4s;
            border-radius: 30px;
            overflow: hidden;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 1.2em;
            width: 1.2em;
            border-radius: 20px;
            left: 0.5em;
            bottom: 0.5em;
            transition: 0.4s;
            transition-timing-function: cubic-bezier(0.81, -0.04, 0.38, 1.5);
            box-shadow: inset 8px -4px 0px 0px #fff;
        }

        .switch input:checked+.slider {
            background-color: #00a6ff;
        }

        .switch input:checked+.slider:before {
            transform: translateX(1.8em);
            box-shadow: inset 15px -4px 0px 15px #ffcf48;
        }

        .star {
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            width: 5px;
            transition: all 0.4s;
            height: 5px;
        }

        .star_1 {
            left: 2.5em;
            top: 0.5em;
        }

        .star_2 {
            left: 2.2em;
            top: 1.2em;
        }

        .star_3 {
            left: 3em;
            top: 0.9em;
        }

        .switch input:checked~.slider .star {
            opacity: 0;
        }

        .cloud {
            width: 3.5em;
            position: absolute;
            bottom: -1.4em;
            left: -1.1em;
            opacity: 0;
            transition: all 0.4s;
        }

        .switch input:checked~.slider .cloud {
            opacity: 1;
        }

        /* css table */
        .container {
            background: #060c21;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 40px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #3b4689;
            flex-shrink: 0;
        }

        .toolbar-right {
            display: flex;
            gap: 12px;
        }

        .toolbar-left {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            background: #3b4689;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: #e3e2e9;
            border: none;
        }

        .btnImport {
            padding: 8px 16px;
            background: #8f8ca3;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: white;
            border: none;
            visibility: hidden;
        }

        .btnImport:hover {
            background: linear-gradient(90deg, #2193b0, #6dd5ed);
            color: #fff;
            transition: background 0.3s ease-in-out;
        }


        .btnImport.visible {
            visibility: visible;
        }

        .btn:hover {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        }

        .btn.active {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        }

        .search-box {
            position: relative;
            display: inline-block;
        }

        .search-box input {
            padding-left: 20px;
            width: 700px;
            height: 32px;
            border: none;
            font-size: 14px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .search-box input::placeholder {
            color: #d1d5db;
        }

        .search-box input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: #888;
            pointer-events: none;
        }

        /* List View */
        .list-view {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            display: none;
        }

        .list-view::-webkit-scrollbar {
            width: 8px;
        }

        .list-view::-webkit-scrollbar-track {
            background: #060c21;
        }

        .list-view::-webkit-scrollbar-thumb {
            background: #3b4689;
            border-radius: 4px;
        }

        .list-view::-webkit-scrollbar-thumb:hover {
            background: #4a56a0;
        }

        .table-header,
        .table-row {
            display: grid;
            grid-template-columns: 0.4fr 1.2fr 1.5fr 0.8fr 1fr 1fr 1fr 1.2fr 1.2fr 1.2fr;
            align-items: center;
            text-align: center;
            padding: 10px 0;
            width: 100%;
        }

        .table-header {
            display: grid;
            grid-template-columns: 0.4fr 1.2fr 1.5fr 0.8fr 1fr 1fr 1fr 1.2fr 1.2fr 1.2fr;
            align-items: center;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            font-weight: bold;
            background-color: #3b4689;
            color: #fff;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-row {
            border-bottom: 1px solid #2a2a3a;
            color: #e3e2e9;
            transition: background 0.2s;
            position: relative;
        }

        .table-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .table-row.selected {
            background: #f0f7ff;
        }

        /* Hiệu ứng border gradient cho dòng có status 'Run' */
        .table-row.running {
            position: relative;
            background: linear-gradient(#060c21, #060c21) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            border: 2px solid transparent;
            border-radius: 4px;
            animation: borderMove 3s linear infinite;
            background-size: 200% 100%;
        }

        .table-row.running:hover {
            background: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05)) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            color: black;
            border: 2px solid transparent;
        }

        @keyframes borderMove {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 200% 0%;
            }
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .status-admin {
            background: #e8f0fe;
            color: #1967d2;
        }

        .status-creator {
            background: #e8f0fe;
            color: #1967d2;
        }

        .status-general {
            background: #e6f4ea;
            color: #137333;
        }

        /* Grid View */
        .grid-view {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 24px;
            background-color: #1e2044;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            display: none;
        }

        .grid-view.active {
            display: grid;
        }

        .grid-view::-webkit-scrollbar {
            width: 8px;
        }

        .grid-view::-webkit-scrollbar-track {
            background: #1e2044;
        }

        .grid-view::-webkit-scrollbar-thumb {
            background: #3b4689;
            border-radius: 4px;
        }

        .grid-view::-webkit-scrollbar-thumb:hover {
            background: #4a56a0;
        }

        .card {
            position: relative;
            background: #060c21;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .card.running {
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
            overflow: hidden;
            /* CHỈ thêm overflow: hidden cho card running */
        }


        /* Tạo lớp border xoay */
        .card.running::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent,
                    transparent,
                    transparent,
                    #00d4ff);
            animation: rotate 4s linear infinite;
            z-index: 0;
        }

        .card.running::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #060c21;
            border-radius: 11px;
            z-index: 1;
        }


        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            color: #e3e2e9;
        }

        .card-body {
            position: relative;
            z-index: 2;
            font-size: 14px;
            color: #e3e2e9;
        }

        .card-body div {
            margin-bottom: 8px;
        }

        .card-body strong {
            color: #e3e2e9;
            display: inline-block;
            width: 100px;
            white-space: nowrap;
            margin-right: 26px;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-badge.complete {
            background-color: rgba(0, 128, 0, 0.5);
            color: white;
            border: 1px solid #159957;
        }

        .status-badge.wait {
            background-color: rgba(255, 165, 0, 0.5);
            color: white;
            border: 1px solid #f5af19;
        }

        .status-badge.run {
            background-color: rgba(109, 213, 237, 0.5);
            color: white;
            border: 1px solid #0083B0;
        }

        .list-view.active {
            display: block;
        }

        .hidden {
            display: none;
        }

        .searchInput {
            visibility: hidden;
        }

        .searchInput.visible {
            visibility: visible;
        }

        .factory {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            appearance: none;
            /* ẩn mũi tên mặc định */
            outline: none;
        }

        .factory option {
            color: black;
        }



        /* Footer */
        footer {
            color: white;
            font-size: 12px;
            text-align: right;
            background-color: transparent;
            padding: 20px 20px;
            position: fixed;
            bottom: 0;
            right: 0;
            left: auto;
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-menu {
                position: fixed;
                left: -100%;
                top: 60px;
                flex-direction: column;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                width: 100%;
                text-align: center;
                transition: 0.3s;
                box-shadow: 0 10px 27px rgba(0, 0, 0, 0.05);
            }

            .nav-menu.active {
                left: 0;
            }

            .nav-menu li {
                margin: 0;
            }

            .nav-menu li a {
                padding: 20px;
            }

        }
    </style>
</head>

<body>
    <div class="all">
        <!-- Navigation -->
        <nav>
            <div class="nav-container">
                <div class="logo"><span><img style="width: 80px;" src="/images/logo.png" alt=""></span><a
                        href="#home">DELIVERY MANAGEMENT</a></div>
                <ul class="nav-menu" id="navMenu">
                    <li class="home"><a href="#">Home</a></li>
                    <li class="delivery"><a href="#delivery">Delivery</a></li>
                    <li class="history"><a href="#history">History</a></li>
                    <li class="admin"><a href="#admin">Admin</a></li>
                    <li class="logout">
                        <a href="#">
                            <span>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-log-out-icon lucide-log-out">
                                    <path d="m16 17 5-5-5-5" />
                                    <path d="M21 12H9" />
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                </svg>
                            </span>
                        </a>
                    </li>
                </ul>
                <label class="switch">
                    <input checked="true" id="checkbox" type="checkbox" />
                    <span class="slider">
                        <div class="star star_1"></div>
                        <div class="star star_2"></div>
                        <div class="star star_3"></div>
                        <svg viewBox="0 0 16 16" class="cloud_1 cloud">
                            <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff"
                                d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925">
                            </path>
                        </svg>
                    </span>
                </label>

            </div>
        </nav>

        <div class="container">
            <div class="toolbar">
                <div class="toolbar-left">
                    <select id="factorySelect" class="factory">
                        <option value="V0">V0</option>
                        <option value="V5">V5</option>
                    </select>
                    <button class="btnImport">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-import-icon lucide-import">
                            <path d="M12 3v12" />
                            <path d="m8 11 4 4 4-4" />
                            <path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4" />
                        </svg>
                        Import
                    </button>
                    <div class="search-box">
                        <input class="searchInput" type="text" placeholder="Scan QR">
                    </div>
                    <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none;">
                </div>
                <div class="toolbar-right">
                    <button class="btn active" id="listBtn">
                        <span>☰</span> List
                    </button>
                    <button class="btn" id="gridBtn">
                        <span>⊞</span> Grid
                    </button>
                </div>
            </div>

            <div class="table-header" id="tableHeader">
                <div>STT</div>
                <div>MOBIS CODE</div>
                <div>MODEL NAME</div>
                <div>TYPE</div>
                <div>STATUS</div>
                <div>TARGET</div>
                <div>QUANTITY</div>
                <div>COMPLETE TIME</div>
                <div>SHIPPING DATE</div>
                <div>SHIPPING METHOD</div>
            </div>

            <div id="listView" class="list-view active">
                <!-- List items will be inserted here -->
            </div>

            <div id="gridView" class="grid-view">
                <!-- Grid cards will be inserted here -->
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2025 Copyright for Partron VN</p>
        </footer>
        <script>
            // Theme Toggle Logic
            const themeToggle = document.getElementById('checkbox');
            const body = document.body;

            // Kiểm tra theme đã lưu
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                themeToggle.checked = true;
            } else {
                themeToggle.checked = false;
            }

            themeToggle.addEventListener('change', (e) => {
                body.classList.toggle('light-theme');
                const isLight = body.classList.contains('light-theme');

                // Lưu theme vào localStorage
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            });


            // Navigation Logic
            const navLinks = document.querySelectorAll('.nav-menu a');
            const logoLink = document.querySelector('.logo a');

            // Khôi phục menu active
            const savedMenu = sessionStorage.getItem('activeMenu');
            if (savedMenu) {
                navLinks.forEach(link => link.classList.remove('active'));
                const target = document.querySelector(`.${savedMenu} a`);
                if (target) target.classList.add('active');
            }

            logoLink.addEventListener('click', e => {
                e.preventDefault();
                navLinks.forEach(link => link.classList.remove('active'));
                const homeLink = document.querySelector('.home a');
                homeLink.classList.add('active');
                sessionStorage.setItem('activeMenu', 'home');
                window.location.href = '/home';
            });

            // Lắng nghe click cho toàn bộ menu
            navLinks.forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    const parentClass = link.parentElement.classList[0];

                    // Bỏ qua nếu là theme toggle
                    if (parentClass === 'theme-toggle') return;

                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    sessionStorage.setItem('activeMenu', parentClass);

                    // Xử lý hành động theo từng menu
                    switch (parentClass) {
                        case 'home':
                            window.location.href = '/home';
                            break;

                        case 'logout':
                            if (confirm('Are you sure you want to logout?')) {
                                sessionStorage.clear();
                                localStorage.clear();
                                fetch('/exportmanagement/logout', {
                                    method: 'POST',
                                    credentials: 'include'
                                }).then(() => {
                                    window.location.href = '/';
                                });

                            }
                            break;

                        case 'delivery':
                            window.location.href = '/delivery';
                            break;

                        case 'history':
                            window.location.href = '/deliveryHistory';
                            break;

                        case 'admin':
                            window.location.href = '/admin';
                            break;
                        default:
                            console.log('Unknown menu item:', parentClass);
                            break;
                    }
                });
            });       
        </script>
        <script type="module" src="/js/delivery.js"></script>
    </div>
</body>

</html>
