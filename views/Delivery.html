<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
    <script type="module" src="/js/main.js"></script>
    <title>Delivery Management - Trang chủ</title>
    <audio id="errorSound" src="/images/errorsound.mp3" preload="auto"></audio>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #040818;
            overflow-x: hidden;
        }

        /* Light mode */
        body.light-theme {
            background-color: white;
            color: #e3e2e9;
        }

        /* nav */
        body.light-theme nav {
            background: linear-gradient(to right, #667db6, #0082c8, #0082c8, #667db6);
        }

        body.light-theme .nav-menu li a.active {
            background: #2a8f9e;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            color: white;
        }

        body.light-theme .nav-menu li a:hover {
            background: #2a8f9e;
            color: white;
            transform: translateY(-2px);
        }

        body.light-theme .nav-menu li a {
            color: white;
        }

        body.light-theme .logo a {
            color: white;
        }

        body.light-theme .nav-menu li a::before {
            background: #6dd5ed;
        }


        /* Hiệu ứng khi quantity được cập nhật */
        .quantity-updated {
            animation: highlightPulse 2s ease-in-out;
        }

        @keyframes highlightPulse {
            0% {
                background-color: #4ade80;
                transform: scale(1);
            }

            50% {
                background-color: #22c55e;
                transform: scale(1.1);
            }

            100% {
                background-color: transparent;
                transform: scale(1);
            }
        }

        /* Làm cho số nổi bật hơn khi animate */
        .quantity-cell {
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .quantity-updated .quantity-cell {
            color: #fff;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        /* content*/
        body.light-theme .container {
            background-color: white;
            border: 1px solid #ccc;
        }

        body.light-theme .table-header {
            background-color: #2980b9;
            color: white;
        }

        body.light-theme .table-row {
            border-bottom: 1px solid #ccc;
            color: #333;
            font-weight: 500;
        }

        body.light-theme .grid-view {
            background-color: white;
        }

        body.light-theme .card {
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body.light-theme .card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }


        body.light-theme .table-row.running {
            position: relative;
            background: linear-gradient(white, white) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            border: 2px solid transparent;
            border-radius: 4px;
            animation: borderMove 3s linear infinite;
            background-size: 200% 100%;
        }

        body.light-theme .table-row.running:hover {
            background: linear-gradient(rgba(42, 143, 158, 0.05), rgba(42, 143, 158, 0.05)) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            border: 2px solid transparent;
        }

        /* Sửa lại CSS cho light mode - card running */
        body.light-theme .card.running::after {
            background: white;
            border-radius: 11px;
        }


        body.light-theme .card-header {
            color: black;
        }

        body.light-theme .card-body {
            color: black;
        }

        body.light-theme .card-body strong {
            color: black;
        }

        body.light-theme .card-body span {
            color: black;
        }


        body.light-theme .status-badge.complete {
            background-color: rgba(0, 128, 0, 0.3);
            color: #43955e;
            border: 1px solid #43955e;
        }

        body.light-theme .status-badge.wait {
            background-color: rgba(255, 165, 0, 0.5);
            color: orange;
            border: 1px solid #f5af19;
        }

        body.light-theme .status-badge.run {
            background-color: rgba(109, 213, 237, 0.5);
            color: #2193b0;
            border: 1px solid #0083B0;
        }

        body.light-theme .grid-view::-webkit-scrollbar-track {
            background: #f5f7fa;
        }

        body.light-theme .grid-view::-webkit-scrollbar-thumb {
            background: #c0c0c0;
        }

        body.light-theme .grid-view::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        body.light-theme .list-view::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        body.light-theme .list-view::-webkit-scrollbar-thumb {
            background: #c0c0c0;
        }

        body.light-theme .list-view::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        /* content */
        body.light-theme .toolbar {
            background-color: #2980B9;
        }

        /* Navigation */
        nav {
            background: rgba(6, 12, 34, 0.95);
            backdrop-filter: blur(10px);
            padding: 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            color: white;
            font-size: 30px;
            font-weight: 700;
            padding: 20px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #f4f4f4 0%, #e7d3fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo a {
            color: white;
            text-decoration: none;
        }

        .logo img {
            transition: transform 0.3s ease;
        }

        .logo img:hover {
            transform: scale(1.05);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 8px;
            align-items: center;
        }

        .nav-menu li a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            padding: 12px 28px;
            display: block;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: 0.5px;
            border-radius: 8px;
        }

        .nav-menu li a::before {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: transform 0.3s ease;
        }

        .nav-menu li a:hover {
            background: rgba(102, 126, 234, 0.15);
            color: white;
            transform: translateY(-2px);
        }

        .nav-menu li a:hover::before {
            transform: translateX(-50%) scaleX(1);
        }

        .nav-menu li a.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25) 0%, rgba(118, 75, 162, 0.25) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .nav-menu li a.active::before {
            transform: translateX(-50%) scaleX(1);
        }

        /* From Uiverse.io by JustCode14 */
        /* The switch - the box around the slider */
        .switch {
            font-size: 17px;
            position: relative;
            display: inline-block;
            width: 4em;
            height: 2.2em;
            border-radius: 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Hide default HTML checkbox */
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* The slider */
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #2a2a2a;
            transition: 0.4s;
            border-radius: 30px;
            overflow: hidden;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 1.2em;
            width: 1.2em;
            border-radius: 20px;
            left: 0.5em;
            bottom: 0.5em;
            transition: 0.4s;
            transition-timing-function: cubic-bezier(0.81, -0.04, 0.38, 1.5);
            box-shadow: inset 8px -4px 0px 0px #fff;
        }

        .switch input:checked+.slider {
            background-color: #00a6ff;
        }

        .switch input:checked+.slider:before {
            transform: translateX(1.8em);
            box-shadow: inset 15px -4px 0px 15px #ffcf48;
        }

        .star {
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            width: 5px;
            transition: all 0.4s;
            height: 5px;
        }

        .star_1 {
            left: 2.5em;
            top: 0.5em;
        }

        .star_2 {
            left: 2.2em;
            top: 1.2em;
        }

        .star_3 {
            left: 3em;
            top: 0.9em;
        }

        .switch input:checked~.slider .star {
            opacity: 0;
        }

        .cloud {
            width: 3.5em;
            position: absolute;
            bottom: -1.4em;
            left: -1.1em;
            opacity: 0;
            transition: all 0.4s;
        }

        .switch input:checked~.slider .cloud {
            opacity: 1;
        }

        /* css table */
        .container {
            background: #060c21;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin: 40px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 160px);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #3b4689;
            flex-shrink: 0;
        }

        .toolbar-right {
            display: flex;
            gap: 12px;
        }

        .toolbar-left {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 8px 16px;
            background: #3b4689;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: #e3e2e9;
            border: none;
        }

        .btnImport {
            padding: 8px 16px;
            background: #8f8ca3;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            color: white;
            border: none;
            visibility: hidden;
        }

        .btnImport:hover {
            background: linear-gradient(90deg, #2193b0, #6dd5ed);
            color: #fff;
            transition: background 0.3s ease-in-out;
        }


        .btnImport.visible {
            visibility: visible;
        }

        .btn:hover {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        }

        .btn.active {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
        }

        .search-box {
            position: relative;
            display: inline-block;
        }

        .search-box input {
            padding-left: 20px;
            width: 700px;
            height: 32px;
            border: none;
            font-size: 14px;
            border-radius: 4px;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .search-box input::placeholder {
            color: #d1d5db;
        }

        .search-box input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            fill: #888;
            pointer-events: none;
        }

        /* List View */
        .list-view {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            display: none;
        }

        .list-view::-webkit-scrollbar {
            width: 8px;
        }

        .list-view::-webkit-scrollbar-track {
            background: #060c21;
        }

        .list-view::-webkit-scrollbar-thumb {
            background: #3b4689;
            border-radius: 4px;
        }

        .list-view::-webkit-scrollbar-thumb:hover {
            background: #4a56a0;
        }

        .table-header,
        .table-row {
            display: grid;
            grid-template-columns: 0.4fr 1.2fr 1.5fr 0.8fr 1fr 1fr 1fr 1.2fr 1.2fr 1.2fr;
            align-items: center;
            text-align: center;
            padding: 10px 0;
            width: 100%;
        }

        .table-header {
            display: grid;
            grid-template-columns: 0.4fr 1.2fr 1.5fr 0.8fr 1fr 1fr 1fr 1.2fr 1.2fr 1.2fr;
            align-items: center;
            text-align: center;
            padding: 10px 0;
            width: 100%;
            font-weight: bold;
            background-color: #3b4689;
            color: #fff;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table-row {
            border-bottom: 1px solid #2a2a3a;
            color: #e3e2e9;
            transition: background 0.2s;
            position: relative;
        }

        .table-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .table-row.selected {
            background: #f0f7ff;
        }

        /* Hiệu ứng border gradient cho dòng có status 'Run' */
        .table-row.running {
            position: relative;
            background: linear-gradient(#060c21, #060c21) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            border: 2px solid transparent;
            border-radius: 4px;
            animation: borderMove 3s linear infinite;
            background-size: 200% 100%;
        }

        .table-row.running:hover {
            background: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05)) padding-box,
                linear-gradient(90deg,
                    #00fff0 0%,
                    #00d4ff 25%,
                    #0084ff 50%,
                    #00d4ff 75%,
                    #00fff0 100%) border-box;
            color: black;
            border: 2px solid transparent;
        }

        @keyframes borderMove {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 200% 0%;
            }
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        .status-admin {
            background: #e8f0fe;
            color: #1967d2;
        }

        .status-creator {
            background: #e8f0fe;
            color: #1967d2;
        }

        .status-general {
            background: #e6f4ea;
            color: #137333;
        }

        /* Grid View */
        .grid-view {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 24px;
            background-color: #1e2044;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            display: none;
        }

        .grid-view.active {
            display: grid;
        }

        .grid-view::-webkit-scrollbar {
            width: 8px;
        }

        .grid-view::-webkit-scrollbar-track {
            background: #1e2044;
        }

        .grid-view::-webkit-scrollbar-thumb {
            background: #3b4689;
            border-radius: 4px;
        }

        .grid-view::-webkit-scrollbar-thumb:hover {
            background: #4a56a0;
        }

        .card {
            position: relative;
            background: #060c21;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s;
        }

        .card.running {
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
            overflow: hidden;
            /* CHỈ thêm overflow: hidden cho card running */
        }


        /* Tạo lớp border xoay */
        .card.running::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent,
                    transparent,
                    transparent,
                    #00d4ff);
            animation: rotate 4s linear infinite;
            z-index: 0;
        }

        .card.running::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #060c21;
            border-radius: 11px;
            z-index: 1;
        }


        .card:hover {
            transform: translateY(-2px);
        }

        .card-header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            color: #e3e2e9;
        }

        .card-body {
            position: relative;
            z-index: 2;
            font-size: 14px;
            color: #e3e2e9;
        }

        .card-body div {
            margin-bottom: 8px;
        }

        .card-body strong {
            color: #e3e2e9;
            display: inline-block;
            width: 100px;
            white-space: nowrap;
            margin-right: 26px;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-badge.complete {
            background-color: rgba(0, 128, 0, 0.5);
            color: white;
            border: 1px solid #159957;
        }

        .status-badge.wait {
            background-color: rgba(255, 165, 0, 0.5);
            color: white;
            border: 1px solid #f5af19;
        }

        .status-badge.run {
            background-color: rgba(109, 213, 237, 0.5);
            color: white;
            border: 1px solid #0083B0;
        }

        .list-view.active {
            display: block;
        }

        .hidden {
            display: none;
        }

        .searchInput {
            visibility: hidden;
        }

        .searchInput.visible {
            visibility: visible;
        }

        .factory {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            appearance: none;
            /* ẩn mũi tên mặc định */
            outline: none;
        }

        .factory option {
            color: black;
        }

        /* ===== CHANGE PASSWORD MODAL — DARK NAVY THEME ===== */

        .cp-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 30, 0.75);
            backdrop-filter: blur(6px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .cp-overlay.active {
            display: flex;
        }

        .cp-modal {
            background: #1a2a5e;
            /* navy card — giống panel bảng */
            border: 1px solid #2e4080;
            border-radius: 16px;
            padding: 32px;
            width: 440px;
            max-width: 95vw;
            position: relative;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(99, 179, 255, 0.08);
            animation: cpSlideIn .25s ease;
            color: #e8eeff;
        }

        @keyframes cpSlideIn {
            from {
                opacity: 0;
                transform: translateY(-18px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Close button ── */
        .cp-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #7a8fcc;
            line-height: 1;
            transition: color .2s;
        }

        .cp-close:hover {
            color: #e8eeff;
        }

        /* ── Header ── */
        .cp-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }

        .cp-avatar {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1de9c4, #0ea5e9);
            /* teal → cyan như nav btn */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d1b3e;
            flex-shrink: 0;
            box-shadow: 0 0 16px rgba(29, 233, 196, 0.35);
        }

        .cp-header h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            color: #ffffff;
            letter-spacing: .02em;
        }

        /* ── Info grid ── */
        .cp-info-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(10, 20, 60, 0.55);
            /* nền tối hơn một chút */
            border: 1px solid #2a3f7e;
            border-radius: 12px;
            padding: 16px 18px;
        }

        .cp-info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cp-label {
            font-size: .78rem;
            font-weight: 600;
            color: #6b83c4;
            text-transform: uppercase;
            letter-spacing: .06em;
        }

        .cp-value {
            font-size: .95rem;
            font-weight: 600;
            color: #dde6ff;
        }

        .cp-badge {
            background: linear-gradient(135deg, #1de9c4, #0ea5e9);
            /* teal accent */
            color: #0a1628;
            font-size: .72rem;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 20px;

        <script>
            // Theme Toggle Logic
            const themeToggle = document.getElementById('checkbox');
            const body = document.body;

            // Kiểm tra theme đã lưu
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                body.classList.add('light-theme');
                themeToggle.checked = true;
            } else {
                themeToggle.checked = false;
            }

            themeToggle.addEventListener('change', (e) => {
                body.classList.toggle('light-theme');
                const isLight = body.classList.contains('light-theme');

                // Lưu theme vào localStorage
                localStorage.setItem('theme', isLight ? 'light' : 'dark');
            });


            // Navigation Logic
            const navLinks = document.querySelectorAll('.nav-menu a');
            const logoLink = document.querySelector('.logo a');

            // Khôi phục menu active
            const savedMenu = sessionStorage.getItem('activeMenu');
            if (savedMenu) {
                navLinks.forEach(link => link.classList.remove('active'));
                const target = document.querySelector(`.${savedMenu} a`);
                if (target) target.classList.add('active');
            }

            logoLink.addEventListener('click', e => {
                e.preventDefault();
                navLinks.forEach(link => link.classList.remove('active'));
                const homeLink = document.querySelector('.home a');
                homeLink.classList.add('active');
                sessionStorage.setItem('activeMenu', 'home');
                window.location.href = '/home';
            });

            // Lắng nghe click cho toàn bộ menu
            navLinks.forEach(link => {
                link.addEventListener('click', e => {
                    e.preventDefault();
                    const parentClass = link.parentElement.classList[0];

                    // Bỏ qua nếu là theme toggle
                    if (parentClass === 'theme-toggle') return;

                    navLinks.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    sessionStorage.setItem('activeMenu', parentClass);

                    // Xử lý hành động theo từng menu
                    switch (parentClass) {
                        case 'home':
                            window.location.href = '/home';
                            break;

                        case 'logout':
                            if (confirm('Are you sure you want to logout?')) {
                                sessionStorage.clear();
                                localStorage.clear();
                                fetch('/exportmanagement/logout', {
                                    method: 'POST',
                                    credentials: 'include'
                                }).then(() => {
                                    window.location.href = '/';
                                });

                            }
                            break;

                        case 'delivery':
                            window.location.href = '/delivery';
                            break;

                        case 'history':
                            window.location.href = '/deliveryHistory';
                            break;

                        case 'admin':
                            window.location.href = '/admin';
                            break;
                        default:
                            console.log('Unknown menu item:', parentClass);
                            break;
                    }
                });
            });       
        </script>

        <script>
            // ===== CHANGE PASSWORD LOGIC =====

            // Lấy user info từ token (đã decode sẵn trong app)
            const userInfo = {
                username: "ACM",       // thay bằng biến từ token của bạn
                fullName: "NGUYET",
                role: "MANAGER"
            };

            // Mở modal
            document.getElementById("openChangePass").addEventListener("click", (e) => {
                e.preventDefault();
                document.getElementById("cpUsername").textContent = userInfo.username;
                document.getElementById("cpFullName").textContent = userInfo.fullName;
                document.getElementById("cpRole").textContent = userInfo.role;
                document.getElementById("cpMsg").textContent = "";
                document.getElementById("cpMsg").className = "cp-msg";
                document.getElementById("cpNewPass").value = "";
                document.getElementById("cpConfirmPass").value = "";
                document.getElementById("changePassOverlay").classList.add("active");
            });

            // Đóng modal
            document.getElementById("closeChangePass").addEventListener("click", () => {
                document.getElementById("changePassOverlay").classList.remove("active");
            });
            document.getElementById("changePassOverlay").addEventListener("click", (e) => {
                if (e.target === e.currentTarget)
                    document.getElementById("changePassOverlay").classList.remove("active");
            });

            // Toggle hiện/ẩn mật khẩu
            function togglePass(inputId, btn) {
                const input = document.getElementById(inputId);
                const isText = input.type === "text";
                input.type = isText ? "password" : "text";
                btn.style.opacity = isText ? "1" : ".5";
            }

            // Submit đổi mật khẩu
            async function submitChangePass() {
                const newPass = document.getElementById("cpNewPass").value.trim();
                const confirmPass = document.getElementById("cpConfirmPass").value.trim();
                const msgEl = document.getElementById("cpMsg");
                const btn = document.getElementById("cpSubmitBtn");
                const btnText = document.getElementById("cpBtnText");
                const loader = document.getElementById("cpBtnLoader");

                // Validation
                msgEl.className = "cp-msg";
                if (!newPass) {
                    msgEl.textContent = "⚠ Vui lòng nhập mật khẩu mới.";
                    msgEl.classList.add("error");
                    return;
                }
                if (newPass.length < 6) {
                    msgEl.textContent = "⚠ Mật khẩu phải có ít nhất 6 ký tự.";
                    msgEl.classList.add("error");
                    return;
                }
                if (newPass !== confirmPass) {
                    msgEl.textContent = "⚠ Mật khẩu xác nhận không khớp.";
                    msgEl.classList.add("error");
                    return;
                }

                // Loading state
                btn.disabled = true;
                btnText.style.display = "none";
                loader.style.display = "inline-block";

                try {

                    const res = await fetch("/exportmanagement/change-password", {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            username: userInfo.username,
                            password: newPass
                        })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        msgEl.textContent = "✅ " + data.message;
                        msgEl.classList.add("success");
                        document.getElementById("cpNewPass").value = "";
                        document.getElementById("cpConfirmPass").value = "";
                        setTimeout(() => {
                            document.getElementById("changePassOverlay").classList.remove("active");
                            msgEl.textContent = "";
                            msgEl.className   = "cp-msg";
                        }, 1500);
                    } else {
                        msgEl.textContent = "❌ " + (data.message || "Đổi mật khẩu thất bại.");
                        msgEl.classList.add("error");
                    }
                } catch (err) {
                    msgEl.textContent = "❌ Lỗi kết nối server.";
                    msgEl.classList.add("error");
                } finally {
                    btn.disabled = false;
                    btnText.style.display = "inline";
                    loader.style.display = "none";
                }
            }
        </script>
