<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
  <script type="module" src="/js/history.js"></script>
  <script type="module" src="/js/header.js"></script>
  <title>Delivery Management - History</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #040818;
      height: 100vh;
      overflow: hidden;
    }

    body.light-theme {
      background-color: white;
      color: #e3e2e9;
    }

    body.light-theme nav {
      background: linear-gradient(to right, #667db6, #0082c8, #0082c8, #667db6);
    }

    body.light-theme .nav-menu li a.active {
      background: #2a8f9e;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      color: white;
    }


    body.light-theme .nav-menu li a {
      color: white;
    }

    body.light-theme .logo a {
      color: white;
    }

    body.light-theme .nav-menu li a::before {
      background: #6dd5ed;
    }

    body.light-theme .management-delivery {
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e5e7eb;
    }

    body.light-theme .management-delivery thead {
      background: #f3f4f6;
    }

    body.light-theme .management-delivery th {
      color: #374151;
    }

    body.light-theme .management-delivery td {
      color: #1f2937;
      border-bottom: 1px solid #e5e7eb;
    }

    body.light-theme .management-delivery tr:hover {
      background: #f9fafb;
    }

    body.light-theme .eh-toolbar .searchText,
    body.light-theme .dh-toolbar .searchText {
      background: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    body.light-theme .eh-toolbar .searchText:focus,
    body.light-theme .dh-toolbar .searchText:focus {
      background: white;
      border-color: #2a8f9e;
      outline: none;
    }

    body.light-theme .eh-factory-select,
    body.light-theme #factorySelectDelivery {
      background: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    body.light-theme .eh-factory-select option,
    body.light-theme #factorySelectDelivery option {
      background-color: white;
      color: #1f2937;
    }

    body.light-theme .searchText::placeholder {
      color: #9ca3af;
    }

    body.light-theme input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0);
    }

    body.light-theme .eh-clear-btn,
    body.light-theme #clearFiltersDelivery {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
    }

    body.light-theme .eh-clear-btn:hover,
    body.light-theme #clearFiltersDelivery:hover {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
    }

    body.light-theme .pagination button {
      background: linear-gradient(135deg, #2a8f9e 0%, #0891b2 100%);
    }

    body.light-theme .pagination button:hover {
      background: linear-gradient(135deg, #0e7490 0%, #0e7490 100%);
    }

    body.light-theme .pagination button:disabled {
      background: #e5e7eb;
      color: #9ca3af;
    }

    body.light-theme .tab-pill-bar {
      background: rgba(0, 0, 0, 0.05);
    }

    body.light-theme .tab-pill {
      color: #4b5563;
    }

    body.light-theme .tab-pill.active {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      color: white;
    }

    /* ── light theme: container text color ── */
    body.light-theme .container {
      color: #1f2937;
    }

    /* ── light theme cho dh-container ── */
    body.light-theme .dh-container {
      background: white;
      border: 1px solid #e5e7eb;
    }

    body.light-theme .dh-table-header {
      background: white;
      color: black;
    }

    body.light-theme .dh-table-row {
      border-bottom: 1px solid rgba(0, 0, 0, 0.45);
      color: #333;
      font-weight: 500;
    }

    body.light-theme .dh-table-row:hover {
      background: #f9fafb;
    }

    body.light-theme .dh-table-header>div {
      border: 1px solid rgba(0, 0, 0, 0.45);
      border-bottom: 2px solid rgba(0, 0, 0, 0.45);
    }

    body.light-theme .dh-table-row>div {
      border-right: 1px solid rgba(0, 0, 0, 0.45);
    }

    body.light-theme .dh-table-header>div:last-child,
    body.light-theme .dh-table-row>div:last-child {
      border-right: none;
    }

    body.light-theme .dh-card {
      background: white;
      border: 1px solid #e5e7eb;
    }


    /* ── light theme: date-filter ── */
    body.light-theme .date-filter {
      background: white;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }

    body.light-theme .date-filter:focus {
      border-color: #2a8f9e;
      outline: none;
    }

    /* ── light theme: dh-status-badge ── */
    body.light-theme .dh-status-badge.complete {
      background-color: rgba(0, 128, 0, 0.12);
      color: #15803d;
      border: 1px solid #86efac;
    }

    body.light-theme .dh-status-badge.wait {
      background-color: rgba(255, 165, 0, 0.12);
      color: #b45309;
      border: 1px solid #fcd34d;
    }

    body.light-theme .dh-status-badge.run {
      background-color: rgba(14, 165, 233, 0.12);
      color: #0369a1;
      border: 1px solid #7dd3fc;
    }

    /* ── light theme: dh-first-export-badge ── */
    body.light-theme .dh-first-export-badge {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(5, 150, 105, 0.08));
      color: #059669;
      border: 1px solid rgba(5, 150, 105, 0.3);
    }

    /* ── light theme cho eh-container ── */
    body.light-theme .eh-container {
      background: white;
      border: 1px solid #e5e7eb;
    }

    body.light-theme .eh-table-header {
      background: white;
      color: black;
    }


    body.light-theme .eh-table-row {
      border-bottom: 1px solid rgba(0, 0, 0, 0.45);
      color: #333;
      font-weight: 500;
    }

    body.light-theme .eh-table-row:hover {
      background: #f9fafb;
    }

    body.light-theme .eh-table-header>div {
      border: 1px solid rgba(0, 0, 0, 0.45);
      border-bottom: 2px solid rgba(0, 0, 0, 0.45);
    }

    body.light-theme .eh-table-row>div {
      border-right: 1px solid rgba(0, 0, 0, 0.45);
    }

    body.light-theme .eh-table-header>div:last-child,
    body.light-theme .eh-table-row>div:last-child {
      border-right: none;
    }

    footer {
      color: white;
      font-size: 12px;
      text-align: center;
      padding: 20px;
      position: fixed;
      bottom: 0;
      right: 0;
      left: auto;
      width: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 60px);
      color: white;
      width: 100%;
    }

    .content-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 10px;
      overflow: hidden;
    }

    /* ─── Tab pill bar ─── */
    .tab-pill-bar {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 6px;
      width: fit-content;
    }

    .tab-pill {
      padding: 8px 20px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-pill:hover {
      color: white;
    }

    .tab-pill.active {
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    .tab-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }

    .tab-panel.active {
      display: flex;
    }

    /* ─── Shared toolbar style (dùng cho cả 2 tab) ─── */
    .eh-toolbar,
    .dh-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .eh-toolbar-left,
    .dh-toolbar-left {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ─── Shared select style ─── */
    .eh-factory-select,
    #factorySelectDelivery {
      padding: 6px 8px;
      border-radius: 4px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
    }

    .eh-factory-select:focus,
    #factorySelectDelivery:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
    }

    .eh-factory-select option,
    #factorySelectDelivery option {
      background-color: #2b2b2bb7;
      color: white;
    }

    /* ─── Shared clear button ─── */
    .eh-clear-btn,
    #clearFiltersDelivery {
      background: linear-gradient(135deg, #059669 0%, #2563eb 100%);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .eh-clear-btn:hover,
    #clearFiltersDelivery:hover {
      background: linear-gradient(135deg, #05855c 0%, #225ad3 100%);
    }

    /* ─── Shared search input ─── */
    .searchText {
      padding: 8px 12px;
      border-radius: 4px;
      border: none;
      max-width: 300px;
      min-width: 240px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .searchText::placeholder {
      color: #d1d5db;
    }

    .searchText:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
    }

    /* ─── Date range picker ─── */
    .date-filter {
      padding: 8px;
      border-radius: 4px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 14px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }

    .date-range-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .date-range-input {
      cursor: pointer;
      min-width: 200px;
      caret-color: transparent;
      user-select: none;
    }

    .date-range-hidden {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 1px;
      pointer-events: none;
      top: 100%;
      left: 0;
    }

    /* ─── Pagination ─── */
    .pagination {
      display: flex;
      justify-content: center;
      padding: 12px 0;
      gap: 12px;
      flex-shrink: 0;
    }

    .pagination button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .pagination button:hover {
      background: linear-gradient(135deg, #556cd6 0%, #653d9e 100%);
    }

    .pagination button:disabled {
      background: rgba(102, 126, 234, 0.3);
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* ─── Event History container (giống dh-container) ─── */
    .eh-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #060c21;
      border-radius: 12px;
    }

    .eh-table-header {
      display: grid;
      grid-template-columns: 0.3fr 2.5fr 1fr 1.2fr 0.5fr 0.5fr 1fr 1fr 0.9fr 0.6fr 1.4fr;
      align-items: stretch;
      text-align: center;
      padding: 0;
      text-transform: uppercase;
      font-weight: bold;
      font-size: 14px;
      background-color: #1e2235;
      color: #fff;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .eh-table-header>div {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
      box-sizing: border-box;
    }

    .eh-table-header>div:last-child {
      border-right: none;
    }

    /* ─── Căn chỉnh cột ───────────────────────────────────────────── */
    .col-num {
      justify-content: flex-end !important;
      text-align: right !important;
    }

    .col-text {
      justify-content: flex-start !important;
      text-align: left !important;
    }

    .col-center {
      justify-content: center !important;
      text-align: center !important;
    }

    .eh-table-body {
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      scrollbar-gutter: stable;
    }


    .eh-table-row {
      display: grid;
      grid-template-columns: 0.3fr 2.5fr 1fr 1.2fr 0.5fr 0.5fr 1fr 1fr 0.9fr 0.6fr 1.4fr;
      align-items: stretch;
      text-align: center;
      padding: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      color: #e3e2e9;
      font-size: 14px;
    }

    .eh-table-row>div {
      padding: 8px 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .eh-table-row>div:last-child {
      border-right: none;
    }

    .eh-table-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* ─── Delivery History container ─── */
    .dh-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #060c21;
      border-radius: 12px;
    }

    .dh-table-header,
    .dh-table-row {
      display: grid;
      grid-template-columns: 0.4fr 1.2fr 1.5fr 0.8fr 1fr 1fr 1fr 1.2fr 1.2fr 1.2fr 1.2fr;
      align-items: stretch;
      text-align: center;
      padding: 0;
      width: 100%;
    }

    .dh-table-header {
      text-transform: uppercase;
      font-weight: bold;
      font-size: 14px;
      background-color: #1e2235;
      color: #fff;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .dh-table-header>div {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom: 2px solid rgba(255, 255, 255, 0.25);
      box-sizing: border-box;
      min-width: 0;
    }

    .dh-table-header>div:last-child {
      border-right: none;
    }

    .dh-table-row>div {
      padding: 5px 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: 0;
    }

    .dh-table-row>div:last-child {
      border-right: none;
    }

    .dh-sortable {
      cursor: pointer;
      user-select: none;
      transition: background 0.2s, color 0.2s;
    }

    .dh-sortable:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #6dd5ed;
    }

    body.light-theme .dh-sortable:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #1a5276;
    }

    .eh-table-body,
    .dh-table-body {
      overflow-y: scroll;
      overflow-x: hidden;
      flex: 1;
    }


    .dh-table-row {
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      color: #e3e2e9;
      font-size: 14px;
    }

    .dh-table-row:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .dh-status-badge {
      padding: 1px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
    }

    .dh-status-badge.complete {
      background-color: rgba(0, 128, 0, 0.5);
      color: white;
      border: 1px solid #159957;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
    }

    .dh-status-badge.wait {
      background-color: rgba(255, 165, 0, 0.5);
      color: white;
      border: 1px solid #f5af19;
    }

    .dh-status-badge.run {
      background-color: rgba(109, 213, 237, 0.5);
      color: white;
      border: 1px solid #0083B0;
    }

    .dh-first-export-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.15));
      color: #34d399;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    .search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 10px;
      color: #9ca3af;
      pointer-events: none;
      flex-shrink: 0;
    }

    .search-wrap .searchText {
      padding-left: 32px;
      /* đẩy text sang phải để không đè icon */
    }

    /* Change Password Modal */
    .cp-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 10, 30, 0.75);
      backdrop-filter: blur(6px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .cp-overlay.active {
      display: flex;
    }

    .cp-modal {
      background: #1a2a5e;
      border: 1px solid #2e4080;
      border-radius: 16px;
      padding: 32px;
      width: 440px;
      max-width: 95vw;
      position: relative;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      animation: cpSlideIn .25s ease;
      color: #e8eeff;
    }

    @keyframes cpSlideIn {
      from {
        opacity: 0;
        transform: translateY(-18px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cp-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #7a8fcc;
      line-height: 1;
      transition: color .2s;
    }

    .cp-close:hover {
      color: #e8eeff;
    }

    .cp-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .cp-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1de9c4, #0ea5e9);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0d1b3e;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(29, 233, 196, 0.35);
    }

    .cp-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0;
      color: #fff;
    }

    .cp-info-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(10, 20, 60, 0.55);
      border: 1px solid #2a3f7e;
      border-radius: 12px;
      padding: 16px 18px;
    }

    .cp-info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cp-label {
      font-size: .78rem;
      font-weight: 600;
      color: #6b83c4;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .cp-value {
      font-size: .95rem;
      font-weight: 600;
      color: #dde6ff;
    }

    .cp-badge {
      background: linear-gradient(135deg, #1de9c4, #0ea5e9);
      color: #0a1628;
      font-size: .72rem;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .cp-divider {
      border: none;
      border-top: 1px solid #2a3f7e;
      margin: 20px 0;
    }

    .cp-form h3 {
      font-size: .95rem;
      font-weight: 700;
      margin: 0 0 16px;
      color: #a0b4e8;
      text-transform: uppercase;
    }

    .cp-field {
      margin-bottom: 14px;
    }

    .cp-field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: #6b83c4;
      margin-bottom: 6px;
    }

    .cp-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .cp-input-wrap input {
      width: 100%;
      padding: 10px 42px 10px 14px;
      border: 1.5px solid #2a3f7e;
      border-radius: 10px;
      font-size: .95rem;
      background: rgba(10, 20, 60, 0.6);
      color: #e8eeff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      box-sizing: border-box;
    }

    .cp-input-wrap input::placeholder {
      color: #4a5e9a;
    }

    .cp-input-wrap input:focus {
      border-color: #1de9c4;
      box-shadow: 0 0 0 3px rgba(29, 233, 196, 0.15);
    }

    .cp-eye {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #4a5e9a;
      display: flex;
      align-items: center;
      transition: color .2s;
    }

    .cp-eye:hover {
      color: #1de9c4;
    }

    .cp-msg {
      min-height: 20px;
      font-size: .85rem;
      margin: 6px 0 10px;
      font-weight: 500;
    }

    .cp-msg.error {
      color: #f87171;
    }

    .cp-msg.success {
      color: #4ade80;
    }

    .cp-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #1de9c4, #0ea5e9);
      color: #0a1628;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 4px 20px rgba(29, 233, 196, 0.3);
    }

    .cp-btn:hover:not(:disabled) {
      opacity: .92;
      transform: translateY(-2px);
    }

    .cp-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .cp-spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(10, 22, 40, 0.3);
      border-top-color: #0a1628;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="all">
    <app-header active="history"></app-header>
    <div class="container">
      <div class="content-left">

        <!-- Tab pill switcher -->
        <div class="tab-pill-bar">
          <button class="tab-pill active" id="tabBtnEventHistory" data-tab="eventHistory">Event History</button>
          <button class="tab-pill" id="tabBtnDeliveryHistory" data-tab="deliveryHistory">Delivery History</button>
        </div>

        <!-- ─── TAB 1: Event History ─── -->
        <div class="tab-panel active" id="panelEventHistory">

          <!-- Toolbar ra ngoài bảng, đồng bộ với Delivery History -->
          <div class="eh-toolbar">
            <div class="eh-toolbar-left">
              <select class="eh-factory-select" name="factory" id="factorySelect">
                <option value="V0" selected>V0</option>
                <option value="V5">V5</option>
              </select>
              <div class="search-wrap">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
                <input class="searchText" type="text" id="searchTextDelivery">
              </div>
              <input type="text" id="deliveryDateRangeText" class="date-filter" readonly placeholder="Chọn khoảng ngày"
                style="cursor:pointer;min-width:200px;caret-color:transparent">

              <button class="eh-clear-btn" id="clearFilters">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                  <path d="M16 16h5v5" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Bảng dạng grid giống Delivery History -->
          <div class="eh-container">
            <div class="eh-table-body" id="DeliveryTableBody">
              <div class="eh-table-header">
                <div id="th-his-stt">STT</div>
                <div id="th-his-qr">QR</div>
                <div id="th-his-mobisCode">Mobis Code</div>
                <div id="th-his-modelName">Model Name</div>
                <div id="th-his-type">Type</div>
                <div id="th-his-target">Target</div>
                <div id="th-his-evenQuantity">Quantity</div>
                <div id="th-his-shippingDate">Shipping Date</div>
                <div id="th-his-shippingMethod">Ship Method</div>
                <div id="th-his-eventUser">User</div>
                <div id="th-his-eventTime">Event Time</div>
              </div>
            </div>
          </div>

          <div class="pagination">
            <button id="prevPage">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
              </svg>
            </button>
            <button id="nextPage">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" />
                <path d="m12 5 7 7-7 7" />
              </svg>
            </button>
          </div>
        </div>

        <!-- ─── TAB 2: Delivery History ─── -->
        <div class="tab-panel" id="panelDeliveryHistory">
          <div class="dh-toolbar">
            <div class="dh-toolbar-left">
              <select id="factorySelectDelivery">
                <option value="v0" selected>V0</option>
                <option value="v5">V5</option>
              </select>
              <div class="search-wrap">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
                <input class="searchText" type="text" id="dhSearchText">
              </div>
              <input type="text" id="dhDateRangeText" class="date-filter" readonly placeholder="Chọn khoảng ngày"
                style="cursor:pointer;min-width:200px;caret-color:transparent">
              <button id="clearFiltersDelivery">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                  <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                  <path d="M16 16h5v5" />
                </svg>
              </button>
            </div>
          </div>

          <div class="dh-container">
            <div class="dh-table-body" id="dhTableBody">
              <div class="dh-table-header" id="dhTableHeader">
                <div>STT</div>
                <div>MOBIS CODE</div>
                <div>MODEL NAME</div>
                <div>TYPE</div>
                <div>STATUS</div>
                <div>TARGET</div>
                <div>QUANTITY</div>
                <div>SHIPPING DATE</div>
                <div>SHIPPING METHOD</div>
                <div class="dh-sortable" id="dhSortFirstExport">
                  FIRST EXPORT
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 16 4 4 4-4" />
                    <path d="M7 20V4" />
                    <path d="m21 8-4-4-4 4" />
                    <path d="M17 4v16" />
                  </svg>
                </div>
                <div class="dh-sortable" id="dhSortArriveDate">
                  ARRIVE DATE
                  <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m3 16 4 4 4-4" />
                    <path d="M7 20V4" />
                    <path d="m21 8-4-4-4 4" />
                    <path d="M17 4v16" />
                  </svg>
                </div>
              </div>
              <div class="dh-table-body" id="dhTableBody"></div>
            </div>

            <div class="pagination">
              <button id="dhPrevPage">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m12 19-7-7 7-7" />
                  <path d="M19 12H5" />
                </svg>
              </button>
              <button id="dhNextPage">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 12h14" />
                  <path d="m12 5 7 7-7 7" />
                </svg>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script src="/js/history.js"></script>
    <script src="/js/dayjs.min.js"></script>
</body>

</html>
