<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/stylesheets/Login.css">
    <script type="module" src="/js/login.js"></script>
    <title>Login</title>
</head>

<body>
    <div class="all">
        <div class="login-box">
            <p style="text-transform: uppercase;" id="lbl-login-title">Login</p>
            <form method="POST" id="loginForm">
                <div class="user-box">
                    <input required="" name="username" type="text" id="input-username">
                    <label id="lbl-username">Username</label>
                </div>
                <div class="user-box">
                    <input required="" name="password" type="password" id="input-password">
                    <label id="lbl-password">Password</label>
                </div>

                <!-- Save password + Language dropdown on same row -->
                <div class="bottom-row">
                    <div class="save-pass-wrap">
                        <input type="checkbox" id="savePassword">
                        <label for="savePassword" id="lbl-save-password">Save password?</label>
                    </div>

                    <div class="lang-wrap" id="langWrap">
                        <div class="lang-trigger" id="langTrigger">
                            <span class="lang-flag" id="langFlag">🇺🇸</span>
                            <span id="langLabel">EN</span>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </div>
                        <div class="lang-menu" id="langMenu">
                            <div class="lang-option active" data-lang="en" data-flag="🇺🇸" data-label="EN">
                                <span class="lang-flag">🇺🇸</span> English
                            </div>
                            <div class="lang-option" data-lang="vi" data-flag="🇻🇳" data-label="VI">
                                <span class="lang-flag">🇻🇳</span> Tiếng Việt
                            </div>
                            <div class="lang-option" data-lang="kr" data-flag="🇰🇷" data-label="KR">
                                <span class="lang-flag">🇰🇷</span> 한국어
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" id="submitBtn">
                    <span></span><span></span><span></span><span></span>
                    <span id="lbl-submit">Submit</span>
                </button>
            </form>
        </div>
    </div>
</body>

</html>
