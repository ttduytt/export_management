<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logoweb.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/stylesheets/Login.css">
    <script type="module" src="/js/login.js"></script>
    <title>Login</title>
</head>

<body>
    <div class="all">
<div class="login-box">
    <p style="text-transform: uppercase;">Login</p>
    <form method="POST" id="loginForm">
        <div class="user-box">
            <input required="" name="username" type="text">
            <label>Username</label>
        </div>
        <div class="user-box">
            <input required="" name="password" type="password">
            <label>Password</label>
        </div>
        <div style="display: flex; align-items: center; margin: 15px 0; gap: 8px;">
            <input type="checkbox" id="savePassword" style="width: 18px; height: 18px; cursor: pointer; accent-color: #03e9f4;">
            <label for="savePassword" style="color: white; margin: 0; cursor: pointer; font-size: 14px; user-select: none;">Save password ?</label>
        </div>
        <button type="submit" id="submitBtn">
            <span></span><span></span><span></span><span></span>
            Submit
        </button>
    </form>
    <p>Forgot your password? <a href="#" class="a2" id="forgotBtn">Reset it here!</a></p>
</div>
    </div>
</body>

</html>
